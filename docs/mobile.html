<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRTS · 手机端</title>
<meta name="description" content="PRTS 手机端 —— 扫码连接电脑，在手机上控制 dsh 操作电脑本地。">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='14' width='36' height='36' transform='rotate(45 32 32)' fill='none' stroke='%23FAFAFA' stroke-width='2.5'/%3E%3Ctext x='32' y='42' font-size='18' font-style='italic' font-weight='700' fill='%23FAFAFA' text-anchor='middle' font-family='sans-serif'%3EPRTS%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#0A0A0B; --panel:#0D0D0E; --ink:#FAFAFA; --dim:#9C9CA1; --line:rgba(250,250,250,.14); --line2:rgba(250,250,250,.3); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; line-height:1.9; min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:48px 24px 80px; position:relative; }
  .mark { position:fixed; left:50%; top:38%; width:220px; height:220px; border:1px solid rgba(250,250,250,.1); transform:translate(-50%,-50%) rotate(45deg); z-index:0; pointer-events:none; }
  .sq { position:fixed; left:50%; top:38%; width:100px; height:100px; border:1px solid rgba(250,250,250,.08); transform:translate(-50%,-50%); z-index:0; pointer-events:none; }
  .inner { position:relative; z-index:1; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand .d { width:12px; height:12px; border:1.5px solid var(--ink); transform:rotate(45deg); }
  .brand .w { font-style:italic; font-weight:700; letter-spacing:.3em; font-size:19px; }
  h1 { font-style:italic; font-weight:600; letter-spacing:.06em; font-size:24px; margin-bottom:6px; }
  .eyebrow { font-size:10px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase; }
  p { color:var(--dim); margin:10px 0; }
  .steps { margin:26px 0; }
  .step { display:flex; gap:14px; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--panel); }
  .step .n { flex:none; width:26px; height:26px; border:1px solid var(--line2); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink); }
  .step b { color:var(--ink); font-weight:600; }
  .note { border-left:2px solid var(--line2); padding-left:12px; color:var(--dim); font-size:13px; }
  a.back { display:inline-block; margin-top:18px; color:var(--ink); text-decoration:none; border:1px solid var(--line2); border-radius:10px; padding:8px 18px; font-size:13px; }
</style>
</head>
<body>
<div class="mark"></div><div class="sq"></div>
<div class="wrap"><div class="inner">
  <div class="brand"><span class="d"></span><span class="w">PRTS</span></div>
  <div class="eyebrow">MOBILE · 手机端</div>
  <h1>扫码连接电脑</h1>
  <p>手机端<b style="color:var(--ink)">无需安装</b>任何东西 —— 它只负责扫码连接你的电脑，之后就能在手机上控制电脑里的 dsh：对话、运行工具、操作电脑本地文件、审批，全部和电脑上一致。主题与配色跟随你在电脑 PRTS 里的设置。</p>
  <div class="steps">
    <div class="step"><span class="n">1</span><span>在<b>电脑</b>上打开 PRTS，进入 设置 → PRTS → <b>移动端</b></span></div>
    <div class="step"><span class="n">2</span><span>用手机<b>扫屏幕上的二维码</b>（或手动输入显示的地址）</span></div>
    <div class="step"><span class="n">3</span><span>页面打开后，用浏览器菜单<b>「添加到主屏幕」</b>，即可像 App 一样使用</span></div>
  </div>
  <div class="note">要求：手机与电脑连接同一个 Wi-Fi / 局域网。二维码随时可以在电脑 PRTS 里重置。</div>
  <a class="back" href="index.html">‹ 返回下载页</a>
</div></div>
</body>
</html>
