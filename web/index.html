    P.dsh.on('connect', () => { refreshAll().catch(() => { /* dsh may still be warming up */ }); });
    // The host command directory changed (plugin added/removed a command) —
    // drop the cached directory so the chip and autocomplete repull.
    P.dsh.on('commands/change', () => { if (P.dshState.invalidateCommands) P.dshState.invalidateCommands(); });
    // Live projection frames → stats dock, permission chip and meter.
    P.dsh.on('session/projection', (frame) => {
      const pl = frame.payload || {};
      if (!pl.sessionId) return;
      const bucket = P.dshState.liveProjections[pl.sessionId] || (P.dshState.liveProjections[pl.sessionId] = {});
      bucket[pl.key] = pl.value;
      if (pl.sessionId !== P.dshState.currentSessionId) return;
      if (pl.key === 'sessionStats' || pl.key === 'tokenUsage' || pl.key === 'contextPressure') renderStatsDock();
      if (pl.key === 'contextPressure') updateMeter();
      if (pl.key === 'permissions') {
        P.dshState.permissions = P.dshState.permissionState(pl.sessionId);
        updatePermissionChip();
        if (A.refreshPermissionPop) A.refreshPermissionPop();
      }
    });
    // Periodic session-list refresh keeps summaries (titles, stats, running
    // flags, permissions) fresh even when the mux is quiet.
    setInterval(() => {
      if (!P.dshState.currentSessionId) return;
      const before = P.dshState.sessions.length;
      P.dshState.listSessions().then(() => {
        if (P.dshState.sessions.length !== before) { renderSessions(); renderWorkspaces(); }
        else highlightSessions();   // titles/stats live in projections
        renderStatsDock();
        updateMeter();
      }).catch(() => { /* noop */ });
    }, 8000);
    // Readiness gate: the intro stays "NOT READY" until the workspace +
    // session data actually finished loading. The preload runs frame-yielded
    // so the particle effect never stutters while dsh boots; only when it is
    // done does A.ready flip and the intro offer "READY — click to enter".
    let preloadStarted = false;
    const rafYield = () => new Promise((r) => requestAnimationFrame(r));
    async function preloadData() {
      if (preloadStarted) return;
      preloadStarted = true;
      const dbg = (stage, e) => {
        if (typeof process === 'undefined') return;
        try { if (window.prts && window.prts.env) console.error('[prts-preload] ' + stage + ':', e && e.message ? e.message : e); } catch (err) { /* noop */ }
      };
      try { await P.dshState.listWorkspaces(); } catch (e) { dbg('workspaces', e); }
      await rafYield();
      try { await P.dshState.listSessions(); } catch (e) { dbg('sessions', e); }
      await rafYield();
      await Promise.allSettled([P.dshState.listModels(), P.dshState.listProviders(), P.dshState.listPresets()]);
      await rafYield();
      try { await renderWorkspaces(); } catch (e) { dbg('renderWorkspaces', e); }
      try { await renderSessions(); } catch (e) { dbg('renderSessions', e); }
      await rafYield();
      // "Loaded" means everything: the session is open AND its messages
      // finished rendering. Until then the intro stays NOT READY. A failing
      // step never toasts "无法连接" — only the ping loop does that.
      try { await A.ensureSession(); } catch (e) { dbg('ensureSession', e); }
      await rafYield();
      A.ready = true;
      A._loadOnIntro = false;
    }
    // Hard fuse: whatever happens, the intro must become enterable (silent).
    setTimeout(() => {
      if (!A.ready) A.ready = true;
    }, 30000);
    A.afterIntro = function () {
      if (A.ready) {
        A.ensureSession().catch(() => { /* session load is best-effort */ });
        maybeOnboardApiKey();
      }
    };

    /** First-run onboarding (dsh-web parity): prompt to configure the
     *  DeepSeek API key; if the Doctor has no key, offer a jump to the
     *  official site to register one. Runs exactly once per profile. */
    async function maybeOnboardApiKey() {
      A.config.ui = A.config.ui || {};
      if (A.config.ui.onboardedApiKey) return;
      A.config.ui.onboardedApiKey = true;
      await P.store.saveConfig(A.config);
      let configured = false;

        action.disabled = false;
        action.textContent = t('market.install');
      }
    } catch (e) {
      P.app.toast(e.message);
      action.disabled = false;
      action.textContent = t('market.install');
    }
  }

  function card(item) {
    const isInstalled = state.installedSkills && state.installedSkills.has(item.name);
    const card = el('div', 'pCard');
    const head = el('div', 'pCardHead');
    head.style.cursor = 'default';
    const name = el('span', 'pName', item.displayName || item.name);
    const catBadge = el('span', 'pState', t('market.cat.' + (item.category || 'tool')));
    const badge = el('span', 'pState', 'SKILL');
    badge.dataset.state = 'ok';
    head.appendChild(name); head.appendChild(catBadge); head.appendChild(badge);
    const body = el('div', 'pCardBody');
    body.style.display = '';
    body.appendChild(el('div', 'pModels', item.description || ''));
    if (item.repo && item.repo !== 'local') {
      const link = el('a', 'mLink', item.repo.replace(/^https?:\/\/(www\.)?github\.com\//, 'github.com/'));
      link.href = item.repo;
      link.target = '_blank';
      link.rel = 'noopener';
      body.appendChild(link);
    }
    const action = el('button', 'sBtn' + (isInstalled ? '' : ' primary'));
    action.type = 'button';
    action.textContent = isInstalled ? t('market.installed') : t('market.install');
    action.disabled = isInstalled || (!item.repo || item.repo === 'local' || item.builtin);
    if (!action.disabled) action.addEventListener('click', () => installSkill(item, action));
    body.appendChild(action);
    card.appendChild(head); card.appendChild(body);
    return card;
  }

  const CATS = {
    all: 'market.cat.all', design: 'market.cat.design', ui: 'market.cat.ui',
    fx: 'market.cat.fx', text: 'market.cat.text', tool: 'market.cat.tool',
    persona: 'market.cat.persona', other: 'market.cat.other',
  };
  const SKILL_CATS = ['all', 'design', 'ui', 'fx', 'text', 'tool', 'persona', 'other'];

  function render() {
    const box = document.getElementById('marketList');
    if (!box) return;
    box.textContent = '';
    const search = el('div', 'mSearch');
    search.innerHTML = P.icons.search || '';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = t('market.searchPlaceholder');
    input.value = state.query;
    input.spellcheck = false;
    input.addEventListener('input', () => { state.query = input.value; render(); });
    search.appendChild(input);
    box.appendChild(search);
    const chips = el('div', 'mCats');
    for (const key of SKILL_CATS) {
      const c = el('button', 'mCat' + (state.category === key ? ' on' : ''), t(CATS[key]));
      c.type = 'button';
      c.dataset.cat = key;
      c.addEventListener('click', () => { state.category = key; render(); });
      chips.appendChild(c);
    }
    box.appendChild(chips);
    const gh = el('div', 'mGh');
    gh.appendChild(el('span', 'mGhLabel', t('market.skillGh')));
    const url = document.createElement('input');
    url.type = 'text';
    url.className = 'sInput';
    url.placeholder = 'https://github.com/owner/skill-repo';
    url.spellcheck = false;
    const go = el('button', 'sBtn primary', t('market.install'));
    go.type = 'button';
    go.addEventListener('click', async () => {
      const repo = url.value.trim();
      if (!/^https?:\/\/github\.com\/[\w.-]+\/[\w.-]+/.test(repo)) { P.app.toast(t('market.skillRepoBad')); return; }
      go.disabled = true;
      try {
        const r = await P.skills.install(repo);
        if (r && r.ok) { P.app.toast(t('market.skillInstalled', { name: repo })); url.value = ''; await refresh(); render(); }
        else P.app.toast(t('market.failed', { msg: (r && (r.error || r.stderr)) || 'error' }));
      } catch (e) { P.app.toast(e.message); }
      go.disabled = false;
    });
    gh.appendChild(url); gh.appendChild(go);
    box.appendChild(gh);
    const grid = el('div', 'mGrid');
    const q = state.query.trim().toLowerCase();
    const items = state.skills.filter((s) => {
      if (state.category !== 'all' && s.category !== state.category) return false;
      return !q || String((s.displayName || s.name || '') + ' ' + (s.description || '')).toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) grid.appendChild(el('div', 'hint', t('market.empty')));
    else for (const item of items) grid.appendChild(card(item));
    box.appendChild(grid);
  }

  async function open() {
    await refresh();
    render();
  }

  M.open = open;
  M.render = render;
  M.refresh = refresh;
})(typeof globalThis !== 'undefined' ? globalThis : this);


/**
 * PRTS settings shell — the shared settings panel IS dsh-web's own settings
 * modal (identical content on both surfaces): the footer button opens it,
 * the hover popup jumps sections, Esc/mask/close button dismiss it.
 *
 * This module only bridges to that modal (open / close / jump-to-section)
 * plus the ui-theme mirror that keeps the borrowed modal in the PRTS theme.
 * The classic overlay survives as a rare boot-race fallback only.
 */
(function (G) {
  'use strict';
  const P = G.PRTS = G.PRTS || {};
  const ST = P.settingsPanel = {};

  function $id(id) { return document.getElementById(id); }

  /* ---------- settings namespaces (official data) ---------- */

  async function describeAll() {
    try {
      const r = await P.dshState.settingsGet(undefined);
      return (r && r.namespaces) || [];
    } catch (e) { return []; }
  }
  async function nsUpdate(ns, patch) {
    try {
      await P.dshState.settingsUpdate(ns, patch);
      return true;
    } catch (e) {
      if (P.app && P.app.toast) P.app.toast(e.message || String(e));
      return false;
    }
  }

  /* ---------- dsh-web settings modal bridge ---------- */

  const trigger = () => document.querySelector('.VOzbGW_trigger');
  const modalOpen = () => {
    const ov = document.querySelector('.VOzbGW_overlay');
    return !!ov && ov.getBoundingClientRect().width > 0;
  };
  const zhLabels = { general: '通用设置', models: '模型', plugins: '插件', 'agent-presets': 'Agent 预设', 'prts': 'PRTS', 'prts-balance': '余额', 'prts-motion': '动效', 'dshmarket': '插件市场' };

  async function open(cfg) {
    // Mirror the PRTS theme into the ui-theme namespace so the borrowed
    // modal resolves dsh-web's own light/dark tokens to match the surface.
    try {
      const theme = (document.documentElement.dataset.theme || 'dark') === 'light' ? 'light' : 'dark';
      await nsUpdate('ui-theme', { preference: theme });
    } catch (e) { /* noop */ }
    const trig = trigger();
    if (trig) { trig.click(); return; }
    // Fallback (only before dsh-web's UI rendered): the classic overlay.
    const ov = $id('settingsOverlay');
    if (ov) ov.classList.add('open');
  }

  function close() {
    // The modal's own document-level Escape listener is the close path.
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
    const ov = $id('settingsOverlay');
    if (ov) ov.classList.remove('open');
  }

  function show(id) {
    if (!modalOpen()) {
      const trig = trigger();
      if (trig) trig.click();
      else { open(); return; }
    }
    const label = zhLabels[id] || id;
    setTimeout(() => {
      const cells = [...document.querySelectorAll('.VOzbGW_navCell')];
      const cell = cells.find((c) => ((c.querySelector('.VOzbGW_navLabel') || c).textContent || '').trim() === label) || cells[0];
      if (cell) cell.click();
    }, 320);
  }

  ST.open = open;
  ST.close = close;
  ST.show = show;
  ST.render = function () { /* fallback surface renders nothing */ };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
