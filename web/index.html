<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRTS</title>
<style>
/* ===== PRTS logo marks ===== */
.rhombus, .rhombus-lg {
  display: inline-block; position: relative; flex: none;
  transform: rotate(45deg); background: transparent;
  border: 1.5px solid var(--prts-diamond);
}
.rhombus { width: 14px; height: 14px; }
.rhombus-lg { width: 22px; height: 22px; }
.rhombus::after, .rhombus-lg::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(45deg); background: var(--prts-diamond);
}
.rhombus::after { width: 5px; height: 5px; }
.rhombus-lg::after { width: 8px; height: 8px; }
/* custom theme: the diamond marks turn neon */
[data-theme='custom'] .rhombus, [data-theme='custom'] .rhombus-lg {
  filter: drop-shadow(0 0 6px var(--prts-diamond));
  border-color: var(--prts-diamond);
}
[data-theme='custom'] .rhombus::after, [data-theme='custom'] .rhombus-lg::after {
  background: var(--prts-diamond);
}

/* ===== Particle intro overlay ===== */
.intro {
  position: fixed; inset: 0; z-index: 150; background: var(--prts-bg);
  display: flex; align-items: center; justify-content: center;
  opacity: 1; pointer-events: all;
  transition: opacity 0.7s var(--prts-ease-out);
}
.intro.done { opacity: 0; pointer-events: none; }
#introCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Particle "WAIT" hint shown when the user clicks before loading finishes. */
.waitHint {
  position: fixed; z-index: 200; width: 150px; height: 56px;
  transform: translate(-50%, -50%); pointer-events: none;
  transition: opacity 0.5s var(--prts-ease);
}
.waitHint.fade { opacity: 0; }
.introTag {
  position: absolute; left: 50%; bottom: 13vh; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.5em; text-indent: 0.5em;
  color: var(--prts-ink-faint); white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.6s var(--prts-ease);
}
.introTag.show { opacity: 1; }
/* Loading status under the tag: what the particle intro is doing while dsh
   boots in the background (connecting → ready → click to enter). */
.introStatus {
  position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%);
  font-size: 11px; letter-spacing: 0.18em; white-space: nowrap; pointer-events: none;
  color: var(--prts-ink-faint); opacity: 0.9;
  transition: opacity 0.4s var(--prts-ease);
}
.introStatus:empty { opacity: 0; }

/* ===== Trajectory view ===== */
.trajView { flex: 1; overflow-y: auto; padding: 24px; }
.trajItem {
  display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--prts-hairline);
  font-size: 13px; line-height: 22px; color: var(--prts-ink-dim);
}
.trajItem .idx { flex: none; font-family: var(--prts-mono); font-size: 11px; color: var(--prts-ink-faint); padding-top: 3px; }
.trajEmpty { padding: 60px 0; text-align: center; color: var(--prts-ink-faint); font-size: 13px; letter-spacing: 0.08em; }

/* Step timeline (the Trajectory tab) — grouped by turn/step. */
.tlStep {
  margin-bottom: 14px; border: 1px solid var(--prts-hairline); border-radius: 10px;
  background: var(--prts-surface); overflow: hidden;
}
.tlHead {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-bottom: 1px solid var(--prts-hairline);
}
.tlLabel { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--prts-ink); font-family: var(--prts-mono); }
.tlDur { margin-left: auto; font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.tlItem { display: flex; gap: 10px; align-items: baseline; padding: 5px 12px; border-bottom: 1px solid var(--prts-hairline); }
.tlItem:last-of-type { border-bottom: none; }
.tlType { flex: none; width: 118px; font-family: var(--prts-mono); font-size: 10.5px; color: var(--prts-ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tlBrief { min-width: 0; flex: 1; color: var(--prts-ink-faint); font-size: 12px; line-height: 18px; word-break: break-word; white-space: pre-wrap; max-height: 48px; overflow: hidden; }
.tlUsage { padding: 4px 12px 8px; font-size: 10.5px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }

/* Session log overlay (raw events). */
.logCard { width: min(640px, calc(100vw - 48px)); display: flex; flex-direction: column; }
.logCard .settingsHead { margin-bottom: 0; }
.logCard .sBtn { height: 28px; }
.logBody { flex: 1; min-height: 0; max-height: calc(100vh - 180px); overflow-y: auto; padding: 4px 10px 12px; }

/* Stats dock under the composer. */
.dockStats .stat { color: var(--prts-ink-dim); }
.dockStats .statSep { color: var(--prts-ink-faint); }
.dockStats { padding-bottom: 4px; }

/* ===== New project inline form ===== */
.inlineForm { display: flex; gap: 6px; padding: 2px; }
.inlineForm input {
  flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--prts-hairline-strong);
  border-radius: 4px; background: var(--prts-surface); color: var(--prts-ink); font-size: 13px; outline: none;
}

/* ===== Chat flow ===== */
.flowItem { min-width: 0; }
.flowItem:empty { display: none; }
.sessionDivider { display: flex; align-items: center; gap: 12px; padding: 14px 0 2px; color: var(--prts-ink-faint); }
.sessionDivider::before, .sessionDivider::after { content: ''; flex: 1; height: 1px; background: var(--prts-hairline); }
.sessionDivider .dt { font-size: 11px; letter-spacing: 0.24em; }

.userRow { display: flex; justify-content: flex-end; }
.userBubble {
  max-width: min(525px, 82%); padding: 10px 16px; border-radius: 12px;
  background: var(--prts-surface); border: 1px solid var(--prts-hairline);
  color: var(--prts-ink); font-size: 14px; line-height: 24px; white-space: pre-wrap; word-break: break-word;
}
.assistantItem { min-width: 0; }
.para { margin: 0; font-size: 14px; line-height: 24px; color: var(--prts-ink); white-space: pre-wrap; word-break: break-word; }
.para .caret { display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--prts-ink); animation: prts-blink 1s steps(2) infinite; }
@keyframes prts-blink { 50% { opacity: 0; } }
.mdImg { display: block; max-width: 100%; max-height: 360px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--prts-hairline); }
.para code, .userBubble code { padding: 1px 5px; border-radius: 4px; background: var(--prts-surface-2); font-family: var(--prts-mono); font-size: 0.92em; }
.para pre, .userBubble pre { margin: 8px 0; padding: 10px 12px; border-radius: 8px; background: var(--prts-surface); border: 1px solid var(--prts-hairline); overflow-x: auto; font-family: var(--prts-mono); font-size: 12.5px; line-height: 20px; }
.para a, .userBubble a { color: var(--prts-ink); text-decoration: underline; }

.disclosure { min-width: 0; }
.dRow {
  display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 4px; border: none;
  background: transparent; cursor: pointer; color: var(--prts-ink-dim); text-align: left; width: 100%;
}
.dRow:hover { color: var(--prts-ink); }
.dRow .chev { transition: transform 0.2s var(--prts-ease); color: var(--prts-ink-faint); }
.disclosure.open .dRow .chev { transform: rotate(90deg); }
.dTitle { font-size: 13px; line-height: 22px; letter-spacing: 0.02em; }
.dBody { display: none; padding: 2px 0 6px 28px; }
.disclosure.open .dBody { display: block; }
.thinkBody { font-size: 13px; line-height: 22px; color: var(--prts-ink-dim); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; }

.maRow { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 2px; }
.maRow.timeStart { flex-direction: row-reverse; }
.maTime { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); padding: 0 6px; }
.maActions { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 0.15s var(--prts-ease); }
@media (hover: hover) { .userRow:hover .maActions, .assistantItem:hover .maActions, .maActions:focus-within { opacity: 1; } }
.maBtn {
  display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
  border: none; border-radius: 4px; background: transparent; color: var(--prts-ink-faint); cursor: pointer;
}
.maBtn:hover { background: var(--prts-surface-2); color: var(--prts-ink); }
.maBtn.on { color: var(--prts-ink); }

.statsLine { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 0 12px; padding: 6px 24px 0; font-size: 11px; line-height: 20px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.dockStats { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px 18px; padding: 12px 24px; border-top: 1px solid var(--prts-hairline); font-size: 12px; line-height: 20px; color: var(--prts-ink-dim); font-family: var(--prts-mono); }
.dockStats b { font-weight: 600; color: var(--prts-ink); }

.errorRow {
  display: flex; align-items: flex-start; gap: 8px; padding: 10px 14px; border: 1px solid var(--prts-hairline-strong);
  border-radius: 8px; color: var(--prts-ink-dim); font-size: 13px; line-height: 20px;
}
.emptyChat { padding: 60px 0; text-align: center; color: var(--prts-ink-faint); font-size: 13px; letter-spacing: 0.06em; }

/* System / policy rows (commands, permission changes, sandbox switches). */
.sysLine { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--prts-ink-faint); font-size: 11px; font-family: var(--prts-mono); }
.sysDot { width: 4px; height: 4px; border-radius: 50%; background: var(--prts-ink-faint); flex: none; }
.sysText { letter-spacing: 0.04em; }

/* Trajectory view rows. */
.trajItem { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--prts-hairline); font-size: 13px; line-height: 20px; }
.trajItem .idx { flex: none; width: 52px; font-family: var(--prts-mono); font-size: 11px; color: var(--prts-ink-faint); padding-top: 1px; }
.trajBody { min-width: 0; }
.trajType { font-family: var(--prts-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--prts-ink-dim); }
.trajBrief { color: var(--prts-ink-faint); font-size: 12px; word-break: break-word; white-space: pre-wrap; max-height: 64px; overflow: hidden; }

/* Attachment chips in the composer. */
.attachStrip { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 2px 16px; }
.attachChip {
  display: inline-flex; align-items: center; gap: 8px; max-width: 220px; padding: 3px 8px 3px 4px;
  border: 1px solid var(--prts-hairline); border-radius: 8px; background: var(--prts-surface);
}
.attachThumb { width: 30px; height: 30px; object-fit: cover; border-radius: 5px; flex: none; }
.attachName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--prts-ink-dim); }
.attachX {
  width: 18px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent;
  color: var(--prts-ink-faint); font-size: 14px; line-height: 18px; cursor: pointer; flex: none;
}
.attachX:hover { color: var(--prts-ink); background: var(--prts-surface-2); }

/* Context meter popover rows. */
.meterRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 26px; padding: 0 10px; font-size: 12px; }
.meterRow .label { color: var(--prts-ink-dim); }
.meterRow .value { font-family: var(--prts-mono); color: var(--prts-ink); }

/* PRTS modal (prompt / confirm — replaces window.prompt/confirm which Electron disables). */
.modalCard {
  width: min(400px, calc(100vw - 48px)); padding: 18px 20px;
  background: var(--prts-panel); border: 1px solid var(--prts-hairline); border-radius: 12px;
  box-shadow: var(--prts-shadow);
  transform: translateY(10px); transition: transform 0.2s var(--prts-ease-out);
}
.overlay.open .modalCard { transform: translateY(0); }
.modalHead { margin-bottom: 14px; }
.modalHead .title { font-size: 13px; letter-spacing: 0.12em; color: var(--prts-ink); }
.modalExtra { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.modalActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* Approval / question request stack. */
.reqOverlay { align-items: flex-end; justify-content: flex-end; padding: 20px 24px 28px; z-index: 160; }
.reqStack { display: flex; flex-direction: column; gap: 12px; width: min(430px, calc(100vw - 48px)); max-height: calc(100vh - 60px); overflow-y: auto; }
.reqCard {
  padding: 16px 18px; background: var(--prts-panel); border: 1px solid var(--prts-hairline-strong);
  border-radius: 12px; box-shadow: var(--prts-shadow); font-size: 13px; line-height: 21px;
  animation: req-in 0.18s var(--prts-ease-out);
}
.reqCard.closing { opacity: 0; transform: translateY(6px); transition: opacity 0.18s var(--prts-ease), transform 0.18s var(--prts-ease); }
@keyframes req-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.reqHead { display: flex; align-items: baseline; gap: 10px; }
.reqKicker { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--prts-ink-faint); }
.reqMeta { font-family: var(--prts-mono); font-size: 11px; color: var(--prts-ink-dim); }
.reqReason { margin-top: 8px; color: var(--prts-ink-dim); word-break: break-word; max-height: 140px; overflow-y: auto; font-family: var(--prts-mono); font-size: 12px; }
.reqActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.reqQ { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--prts-hairline); }
.reqQHead { display: flex; align-items: baseline; gap: 8px; }
.reqQTitle { font-size: 13px; color: var(--prts-ink); }
.reqOpts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.reqOpt {
  padding: 4px 12px; border: 1px solid var(--prts-hairline); border-radius: 14px; background: transparent;
  color: var(--prts-ink-dim); font-size: 12px; line-height: 20px; cursor: pointer;
}
.reqOpt:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.reqOpt.on { border-color: var(--prts-ink); color: var(--prts-ink); background: var(--prts-surface-2); }
.reqCustom { margin-top: 8px; }

/* ===== Details panel ===== */
.dtPanel { display: flex; flex-direction: column; height: 100%; }
.dtHeader { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 10px 14px; border-bottom: 1px solid var(--prts-hairline); }
.dtTitle { font-size: 13px; letter-spacing: 0.2em; color: var(--prts-ink); font-weight: 500; }
.dtBody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }
.dtEmpty { font-size: 12px; line-height: 20px; color: var(--prts-ink-faint); }
.dtField { margin-bottom: 14px; }
.dtField .k { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--prts-ink-faint); margin-bottom: 4px; }
.dtField .v { font-size: 13px; line-height: 20px; color: var(--prts-ink); word-break: break-word; font-family: var(--prts-mono); }

/* ===== Settings overlay ===== */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: var(--prts-scrim); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity 0.2s var(--prts-ease);
}
.overlay.open { opacity: 1; pointer-events: auto; }
.settingsCard {
  width: min(460px, calc(100vw - 48px)); max-height: calc(100vh - 80px); overflow-y: auto;
  background: color-mix(in srgb, var(--prts-panel) 82%, transparent);
  backdrop-filter: blur(var(--prts-glass-strong, 20px)); -webkit-backdrop-filter: blur(var(--prts-glass-strong, 20px));
  border: 1px solid var(--prts-hairline); border-radius: 12px;
  box-shadow: var(--prts-shadow); padding: 20px 22px;
  transform: translateY(10px); transition: transform 0.2s var(--prts-ease-out);
}
.overlay.open .settingsCard { transform: translateY(0); }
.settingsHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.settingsHead .title { font-size: 14px; letter-spacing: 0.24em; color: var(--prts-ink); }
.sField { margin-bottom: 16px; }
.sField .label { display: flex; align-items: center; justify-content: space-between; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--prts-ink-faint); margin-bottom: 6px; }
.sField .hint { font-size: 11px; line-height: 18px; color: var(--prts-ink-faint); margin-top: 4px; }
.sInput {
  width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--prts-hairline); border-radius: 6px;
  background: color-mix(in srgb, var(--prts-surface) 72%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
  color: var(--prts-ink); font-size: 13px; outline: none;
  transition: border-color 0.15s var(--prts-ease);
}
.sInput:focus { border-color: var(--prts-hairline-strong); }
.sSelect { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--prts-ink-faint) 50%), linear-gradient(135deg, var(--prts-ink-faint) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
.sRow { display: flex; gap: 8px; align-items: center; }
.sBtn {
  display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px;
  border: 1px solid var(--prts-hairline); border-radius: 6px;
  background: color-mix(in srgb, var(--prts-surface) 72%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
  color: var(--prts-ink-dim); font-size: 13px; line-height: 20px; cursor: pointer;
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease);
}
.sBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.sBtn.primary { background: var(--prts-accent); color: var(--prts-bg); border-color: var(--prts-accent); }
.sBtn.primary:hover { opacity: 0.85; }
.sBtn.danger { color: #f7768e; border-color: rgba(247, 118, 142, 0.4); }
.sBtn.danger:hover { border-color: #f7768e; color: #f7768e; background: rgba(247, 118, 142, 0.08); }
.sBtn:disabled { opacity: 0.4; cursor: default; }
.sStatus { font-size: 12px; line-height: 20px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.projectRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.projectRow .pname { flex: 1; font-size: 13px; color: var(--prts-ink); }
.projectRow .pmeta { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }

/* ===== Settings sections (Language / Model config / Plugins / Version) ===== */
.settingsBody { display: flex; flex-direction: column; gap: 20px; }
.sSection { display: flex; flex-direction: column; gap: 8px; }
.sSecTitle {
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--prts-ink-faint); padding-bottom: 4px; border-bottom: 1px solid var(--prts-hairline);
}
.sSecRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sSecRow .sSecTitle { flex: 1; border-bottom: none; padding-bottom: 0; }
.sCollapse { display: flex; flex-direction: column; gap: 8px; }
/* Accordion animation: the body's grid row collapses smoothly, the sections
   below slide up, the toggle itself never moves the card. */
.sCollapse.collapseAnim {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.32s var(--prts-ease-out);
}
.sCollapse.collapseAnim.open { grid-template-rows: 1fr; }
.sCollapse.collapseAnim > .collapseInner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
/* Abstract minimal toggle: a rotated square (diamond) that rights itself
   when the section expands. */
.toggleBtn {
  width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--prts-hairline-strong); border-radius: 4px; background: transparent;
  cursor: pointer; color: var(--prts-ink-dim); flex: none;
  transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease);
}
.toggleBtn:hover { border-color: var(--prts-ink); color: var(--prts-ink); }
.tgDiamond {
  width: 9px; height: 9px; border: 1px solid currentColor;
  transform: rotate(45deg); transition: transform 0.25s var(--prts-ease-out);
}
.toggleBtn.open .tgDiamond { transform: rotate(0deg); }
.sSection .hint { font-size: 11px; line-height: 18px; color: var(--prts-ink-faint); }
.pCard { border: 1px solid var(--prts-hairline); border-radius: 8px; overflow: hidden; }
.pCardHead {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
  border: none; background: transparent; cursor: pointer; color: var(--prts-ink); font-size: 13px;
}
.pCardHead:hover { background: var(--prts-surface-2); }
.pCardHead .pName { flex: 1; text-align: left; }
.pCardHead .chev { color: var(--prts-ink-faint); transition: transform 0.15s var(--prts-ease); }
.pCard.open .pCardHead .chev { transform: rotate(180deg); }
.pState { font-size: 11px; font-family: var(--prts-mono); color: var(--prts-ink-faint); }
.pState[data-state='ok'] { color: var(--prts-accent, var(--prts-ink)); }
.pCardBody { padding: 10px 12px; border-top: 1px solid var(--prts-hairline); background: var(--prts-surface); display: flex; flex-direction: column; gap: 8px; }
.pModels { font-size: 11px; line-height: 17px; color: var(--prts-ink-faint); font-family: var(--prts-mono); word-break: break-all; }
.marketCard { width: min(520px, calc(100vw - 48px)); }
.marketCard .pCard { margin-bottom: 8px; }
.marketCard .pCardHead { cursor: default; }
.marketCard .pModels { font-family: inherit; }
.marketCard .sBtn { margin-top: 6px; }

/* ===== Sidebar ===== */
.sb { display: flex; flex-direction: column; height: 100%; padding: 6px 10px; }
.logoRow { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 8px 4px 8px 46px; }
.brand { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: none; background: transparent; cursor: pointer; color: var(--prts-ink); }
.brand .word {
  font-size: 15px; font-weight: 600; letter-spacing: 0.22em; font-style: italic;
  color: var(--prts-accent);
}
.sbActions { display: flex; align-items: center; gap: 2px; }
.newButtons { display: flex; gap: 6px; padding: 2px 2px 10px; }
.sbBtn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; border: 1px solid var(--prts-hairline); border-radius: 6px;
  background: transparent; color: var(--prts-ink-dim); font-size: 13px; line-height: 20px;
  cursor: pointer; transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease);
}
.sbBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.sbSection { margin: 2px 0 4px; }
.sbSectionHead { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; }
.sbSectionHead .eyebrow { flex: 1; }
.sbSectionHead .count { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.sbList { display: flex; flex-direction: column; gap: 2px; max-height: 40%; overflow-y: auto; }
.sbItem {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
  border: none; border-radius: 8px; background: transparent; cursor: pointer;
  color: var(--prts-ink-dim); font-size: 13px; line-height: 20px; text-align: left;
  transition: background 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.sbItem:hover { background: var(--prts-surface-2); color: var(--prts-ink); }
.sbItem.active { background: var(--prts-surface-2); color: var(--prts-ink); box-shadow: inset 2px 0 0 var(--prts-ink); }
/* workspace file-tree rows: chevron toggle + animated branch (grid-rows
   0fr↔1fr, duration follows the drawer motion setting) */
.sbWsTree .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbTreeChev {
  width: 18px; height: 18px; margin-left: -4px; padding: 0; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 5px; background: transparent;
  color: var(--prts-ink-faint); cursor: pointer;
  transition: transform 0.22s var(--prts-ease-out), color 0.15s var(--prts-ease), background 0.15s var(--prts-ease);
}
.sbTreeChev svg { width: 11px; height: 11px; }
.sbTreeChev:hover { color: var(--prts-ink); background: var(--prts-surface-2); }
.sbTreeBranch {
  display: grid; grid-template-rows: 1fr;
  transition: grid-template-rows var(--prts-drawer-ms, 350ms) cubic-bezier(.2,.8,.25,1);
}
.sbTreeBranch.closed { grid-template-rows: 0fr; }
.sbTreeInner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 2px; }
.sbTreeItem { min-height: 30px; }
.sbTreeMark { flex: none; font-size: 11px; color: var(--prts-ink-faint); margin-right: 2px; }
.sbItem.checked { background: var(--prts-surface-2); }
.sbItem .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbItem .meta { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
/* Modern, quiet archive control: a minimal ghost icon, shown on hover. */
.sbItem .rowBtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; padding: 0; border: none; border-radius: 6px;
  background: transparent; color: var(--prts-ink-faint); cursor: pointer;
  opacity: 0; transform: translateX(3px);
  transition: opacity 0.12s var(--prts-ease), transform 0.12s var(--prts-ease), background 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.sbItem:hover .rowBtn, .sbItem:focus-within .rowBtn { opacity: 1; transform: none; }
.sbItem .rowBtn:hover { background: var(--prts-surface); color: var(--prts-ink); }
.sbItem .rowBtn svg { width: 11px; height: 11px; }
.sbItem:hover .rowBtn { display: inline-flex; }
/* Selection mode: checkbox cell + section-head toggle + bulk bar. */
.sbCheck {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 16px; height: 16px; padding: 0; border: 1px solid var(--prts-hairline-strong);
  border-radius: 5px; background: transparent; color: transparent; cursor: pointer;
  transition: border-color 0.12s var(--prts-ease), background 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.sbCheck:hover { border-color: var(--prts-ink); }
.sbCheck.on { border-color: var(--prts-ink); background: var(--prts-ink); color: var(--prts-bg); }
.headBtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; padding: 0; border: none; border-radius: 5px;
  background: transparent; color: var(--prts-ink-faint); cursor: pointer;
  transition: color 0.12s var(--prts-ease), background 0.12s var(--prts-ease);
}
.headBtn:hover { color: var(--prts-ink); background: var(--prts-surface-2); }
.headBtn.on { color: var(--prts-ink); background: var(--prts-surface-2); box-shadow: inset 0 0 0 1px var(--prts-hairline-strong); }
.bulkBar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin: 4px 2px 0; padding: 6px 8px;
  border: 1px solid var(--prts-hairline); border-radius: 8px; background: var(--prts-surface);
}
.bulkLabel { min-width: 0; flex: 0 1 auto; font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bulkBar .spacer { flex: 1; min-width: 8px; }
.bulkBtn {
  height: auto; min-height: 24px; padding: 1px 10px; border: 1px solid var(--prts-hairline); border-radius: 12px;
  background: transparent; color: var(--prts-ink-dim); font-size: 11px; line-height: 20px; cursor: pointer;
  white-space: nowrap; flex: none;
  transition: border-color 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.bulkBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.bulkBtn.danger { color: var(--prts-ink); border-color: var(--prts-hairline-strong); }
.bulkBtn:disabled { opacity: 0.35; cursor: default; }
/* Single sidebar toggle — fixed at the top-left, never hidden. It collapses
   and re-expands the sidebar in place; the chevron mirrors across the two
   states so it reads as one control. */
.sbToggleBtn {
  position: fixed; left: 10px; top: 12px; z-index: 60;
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; border: 1px solid var(--prts-hairline);
  border-radius: 8px; background: var(--prts-panel); color: var(--prts-ink-dim);
  cursor: pointer; box-shadow: var(--prts-shadow);
  transition: color 0.15s var(--prts-ease), border-color 0.15s var(--prts-ease), background 0.15s var(--prts-ease);
}
.sbToggleBtn:hover { color: var(--prts-ink); border-color: var(--prts-hairline-strong); background: var(--prts-surface-2); }
.sbToggleBtn svg { transition: transform 0.3s var(--prts-ease-out); }
.frame.sbCollapsed .sbToggleBtn svg { transform: rotate(180deg); }

/* Theme toggle: hairline sun/moon pair, crossfading with the theme. */
.themeBtn { position: relative; overflow: hidden; }
.themeIcons { position: relative; display: block; width: 15px; height: 15px; }
.themeIcons svg { position: absolute; inset: 0; transition: opacity 0.25s var(--prts-ease), transform 0.35s var(--prts-ease-out); }
.themeSun { opacity: 0; transform: rotate(-60deg) scale(0.6); }
.themeMoon { opacity: 1; transform: rotate(0) scale(1); }
[data-theme='light'] .themeSun { opacity: 1; transform: rotate(0) scale(1); }
[data-theme='light'] .themeMoon { opacity: 0; transform: rotate(60deg) scale(0.6); }

.sbEmpty { padding: 8px 10px; font-size: 12px; line-height: 18px; color: var(--prts-ink-faint); }
/* Workspace selector chip in the left toolbar (dsh web's sidebar parity):
   current workspace + dropdown to switch or add one. */
.sbWsBtn {
  position: relative; display: flex; align-items: center; gap: 8px;
  width: 100%; height: 32px; margin: 0 0 6px; padding: 0 10px;
  border: 1px solid var(--prts-hairline); border-radius: 8px;
  background: transparent; color: var(--prts-ink-dim); font-size: 13px; line-height: 20px;
  cursor: pointer; transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease);
}
.sbWsBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.sbWsBtn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.sbWsBtn .chev { color: var(--prts-ink-faint); }
/* Session search field. */
.sbSearch {
  display: flex; align-items: center; gap: 6px; margin: 2px 4px 6px; padding: 0 8px;
  height: 28px; border: 1px solid var(--prts-hairline); border-radius: 6px;
  color: var(--prts-ink-faint); background: transparent;
}
.sbSearch:focus-within { border-color: var(--prts-hairline-strong); color: var(--prts-ink-dim); }
.sbSearch input {
  flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent;
  color: var(--prts-ink); font-size: 12px; line-height: 18px;
}
.sbSearch input::placeholder { color: var(--prts-ink-faint); }
.sbSearchClear {
  display: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 3px;
  background: transparent; color: var(--prts-ink-faint); font-size: 12px; line-height: 16px; cursor: pointer;
}
.sbSearchClear:hover { color: var(--prts-ink); }
.sbSearch:focus-within .sbSearchClear, .sbSearch.hasText .sbSearchClear { display: inline-flex; align-items: center; justify-content: center; }
.sbFoot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--prts-hairline); }
.sbFootItem { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; cursor: pointer; color: var(--prts-ink-dim); font-size: 13px; line-height: 20px; }
.sbFootItem:hover { background: var(--prts-surface-2); color: var(--prts-ink); }

/* ===== Conversation column ===== */
.cvt { position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; min-width: 0; }

/* Central voice diamond — semi-transparent rhombus that vibrates with the mic
   (dB drives scale, frequency nudges rotation). Reserved for dsh voice output
   too: `.speaking` vibrates on produced audio just like on captured audio.
   It sits BEHIND the conversation content (z-index:0 vs. the raised header
   and scroll body) so it can never intercept clicks or obscure the chat. */
.voiceDiamond {
  position: absolute; left: 50%; top: 50%; z-index: 0;
  pointer-events: none; transform: translate(-50%, -50%);
  opacity: 0.16; transition: opacity 0.3s var(--prts-ease);
  will-change: transform;
}
.voiceDiamond.on { opacity: 0.5; }
.voiceDiamond.speaking { opacity: 0.72; }
.voiceDiamond .diamondShape {
  display: block; width: 230px; height: 230px;
  border: 1px solid var(--prts-diamond);
  transform: rotate(45deg);
  background: color-mix(in srgb, var(--prts-diamond) 5%, transparent);
  box-shadow: 0 0 60px color-mix(in srgb, var(--prts-diamond) 8%, transparent);
}
.voiceDiamond .squareShape {
  display: block; position: absolute; left: 50%; top: 50%; width: 110px; height: 110px;
  margin: -55px 0 0 -55px;
  border: 1px solid var(--prts-square);
  background: color-mix(in srgb, var(--prts-square) 5%, transparent);
}
/* custom theme: the diamond/square marks go neon (fluorescent) */
[data-theme='custom'] .voiceDiamond .diamondShape {
  border-color: var(--prts-diamond);
  background: color-mix(in srgb, var(--prts-diamond) 7%, transparent);
  box-shadow: 0 0 110px color-mix(in srgb, var(--prts-diamond) 32%, transparent),
    inset 0 0 40px color-mix(in srgb, var(--prts-diamond) 12%, transparent);
}
[data-theme='custom'] .voiceDiamond .squareShape {
  border-color: var(--prts-square);
  background: color-mix(in srgb, var(--prts-square) 7%, transparent);
  box-shadow: 0 0 60px color-mix(in srgb, var(--prts-square) 28%, transparent);
}
.cvtHeader, .scrollBody { position: relative; z-index: 1; }
.cvtHeader { flex: none; padding: 10px 20px 0 16px; border-bottom: 1px solid var(--prts-hairline); }
.cvt[data-phase='hero'] .cvtHeader { display: none; }
.titleRow { display: flex; align-items: center; min-height: 34px; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumb { max-width: 240px; overflow: hidden; padding: 3px 8px; border: none; border-radius: 4px; background: transparent; font-size: 13px; line-height: 20px; color: var(--prts-ink-faint); text-overflow: ellipsis; white-space: nowrap; }
.crumb[disabled] { font-weight: 500; color: var(--prts-ink); cursor: default; }
.crumb { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 500; color: var(--prts-ink); }
.crumb .chev { color: var(--prts-ink-faint); }
.crumb:hover { background: var(--prts-surface-2); }
.headerMode { padding: 0; font-size: 10px; letter-spacing: 0.3em; color: var(--prts-ink-faint); white-space: nowrap; }
.modeChip { border: 1px solid var(--prts-hairline); }
.headerUtils { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.logBtn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border: 1px solid var(--prts-hairline); border-radius: 15px; background: transparent;
  color: var(--prts-ink-dim); font-size: 12px; line-height: 20px; cursor: pointer;
}
.logBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.tabs { display: flex; gap: 28px; padding-left: 6px; }
.tab { position: relative; padding: 8px 0 10px; border: none; background: transparent; font-size: 13px; line-height: 16px; color: var(--prts-ink-faint); cursor: pointer; }
.tab::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent; }
.tab.active { color: var(--prts-ink); }
.tab.active::after { background: var(--prts-ink); }

.scrollBody { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.chatScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 24px 8px; }
.cvt[data-phase='active'] .heroView { display: none; }
.chatColumn { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* ===== Hero ===== */
.heroView { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.heroCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* The logo stack is centred on the background diamond/square behind it: that
   square sits at the .cvt centre, while the hero area stops above the
   composer — --hero-shift (half the composer height, set from JS) pushes the
   stack down onto the square's centre. Text may overflow the square; only the
   centre point matters. */
.heroStack {
  position: absolute; left: 50%; top: 50%; z-index: 1;
  transform: translate(-50%, calc(-50% + var(--hero-shift, 0px)));
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.heroLogo { display: flex; align-items: center; gap: 14px; }
.heroWord {
  font-size: 34px; line-height: 40px; font-weight: 600; font-style: italic;
  letter-spacing: 0.3em; color: var(--prts-ink); text-indent: 0.3em;
}
.heroTagline {
  margin-top: 2px; font-size: 12px; line-height: 18px;
  letter-spacing: 0.3em; text-indent: 0.3em; color: var(--prts-ink-dim);
  font-weight: 400; white-space: nowrap;
}

/* Welcome-screen chip row above the initial input area (dsh web style):
   workspace folder + mode + model + reasoning. */
.heroBar { display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; padding: 0 8px 6px; }
.cvt[data-phase='hero'] .heroBar { display: flex; }
/* The same model/reasoning chips live in the hero bar while on the welcome
   screen — hide the composer-toolbar copies there to avoid duplication. */
.cvt[data-phase='hero'] #modelChip, .cvt[data-phase='hero'] #reasoningChip { display: none; }

/* ===== Composer ===== */
.composerArea { flex: none; width: 100%; max-width: 792px; margin: 0 auto; padding: 8px 24px 18px; }
.statusRow { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 4px 4px; color: var(--prts-ink-faint); font-size: 12px; letter-spacing: 0.06em; }
.shimmer { animation: prts-shimmer 1.6s linear infinite; }
@keyframes prts-shimmer { 0% { opacity: 0.35; } 50% { opacity: 1; } 100% { opacity: 0.35; } }

/* Expand toggle — an up-triangle with a notch and flowing dots (Arknights). */
.composerExpandRow { display: flex; align-items: center; justify-content: center; height: 22px; }
.expandBtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 22px; padding: 0; border: none; background: transparent;
  color: var(--prts-ink-faint); cursor: pointer; opacity: 0.55;
  transition: opacity 0.2s var(--prts-ease), color 0.2s var(--prts-ease);
}
.expandBtn:hover { opacity: 1; color: var(--prts-ink-dim); }
.expandBtn .expandIcon { transition: transform 0.3s var(--prts-ease-out); }
.composerArea.expanded .expandBtn .expandIcon { transform: rotate(180deg); }
.expandBtn .edot { animation: prts-dotflow 2.4s ease-in-out infinite; }
.expandBtn .edot:nth-of-type(2) { animation-delay: 0.3s; }
.expandBtn .edot:nth-of-type(3) { animation-delay: 0.6s; }
@keyframes prts-dotflow { 0%, 100% { opacity: 0.12; } 45% { opacity: 1; } }

/* Borderless composer — no white box, only the caret. */
.composerCard { display: flex; flex-direction: column; }
.composerInput {
  width: 100%; height: 52px; padding: 6px 14px 2px 16px;
  border: none; outline: none; background: transparent; resize: none; overflow-y: auto;
  font-size: 15px; line-height: 24px; color: var(--prts-ink);
  caret-color: var(--prts-ink);
}
.composerInput:focus, .composerInput:focus-visible { outline: none; }
.composerArea.expanded .composerInput { height: min(38vh, 320px); }
.composerInput::placeholder { color: var(--prts-ink-faint); }
.composerToolbar { display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; }
.toolGroup { display: flex; align-items: center; gap: 6px; min-width: 0; }
.spacer { flex: 1; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px;
  padding: 0 10px; border: 1px solid transparent; border-radius: 15px; background: transparent;
  color: var(--prts-ink-dim); font-size: 12px; line-height: 20px; cursor: pointer; white-space: nowrap;
}
.chip:hover { background: var(--prts-surface-2); color: var(--prts-ink); }
.chip .chev { color: var(--prts-ink-faint); }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--prts-ink-faint); }
.chip.on .dot { background: var(--prts-ink); }
.meterBtn { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: none; border-radius: 15px; background: transparent; color: var(--prts-ink-faint); font-size: 12px; line-height: 20px; cursor: pointer; }
.meterBtn:hover { background: var(--prts-surface-2); color: var(--prts-ink-dim); }
.sendBtn {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border: none; border-radius: 17px; padding: 0; background: var(--prts-ink); color: var(--prts-bg);
  cursor: pointer; transition: opacity 0.15s var(--prts-ease), transform 0.15s var(--prts-ease);
}
.sendBtn:hover { opacity: 0.85; }
.sendBtn:disabled { opacity: 0.25; cursor: default; }
.stopBtn {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border: 1px solid var(--prts-hairline-strong); border-radius: 17px; padding: 0;
  background: transparent; color: var(--prts-ink); cursor: pointer;
}
.stopBtn:hover { background: var(--prts-surface-2); }

/* Popovers (model / strength / commands / meter / projects). Triggers sit at
   the bottom of the frame, so popovers open upward and scroll when long. */
.pop {
  position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 60; display: none;
  min-width: 200px; max-width: 280px; max-height: min(46vh, 360px);
  padding: 6px; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 8px;
  background: var(--prts-surface-2); border: 1px solid var(--prts-hairline);
  box-shadow: var(--prts-shadow); color: var(--prts-ink);
}
.pop.open { display: block; }
/* Header chips open downward (they sit near the top edge). */
.pop.below { bottom: auto; top: calc(100% + 6px); }
.pop::-webkit-scrollbar { width: 6px; }
.popItem { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 4px; font-size: 13px; line-height: 20px; cursor: pointer; }
.popItem:hover { background: var(--prts-surface); }
.popItem.selected .label { color: var(--prts-ink); font-weight: 500; }
.popItem .label { color: var(--prts-ink-dim); }
.popItem .tick { margin-left: auto; color: var(--prts-ink); display: none; }
.popItem.selected .tick { display: block; }
.popItem .desc { font-size: 11px; color: var(--prts-ink-faint); }
.popMeta { padding: 8px 10px; font-size: 11px; line-height: 18px; color: var(--prts-ink-faint); border-top: 1px solid var(--prts-hairline); margin-top: 4px; }

/* Slash-command completion dropdown above the composer. */
.cmdCompletion {
  position: absolute; z-index: 80; margin: 0 16px; left: 0; right: 0;
  max-height: 240px; overflow-y: auto;
}
.cmdCompletion .popItem.active { background: var(--prts-surface); }
.cmdCompletion .popItem.active .label { color: var(--prts-ink); }

/* ===== Brand waveform (voice input line effect on the PRTS mark) ===== */
.brandFx { width: 48px; height: 16px; opacity: 0; transition: opacity 0.2s var(--prts-ease); pointer-events: none; }
.brandFx.on { opacity: 1; }
.brandFx.listening { opacity: 0.45; }
.brandFx.speaking { opacity: 1; }

/* ===== Voice input button ===== */
.voiceBtn { gap: 4px; }
.voiceBtn .micIcon { color: var(--prts-ink-faint); }
.voiceBtn:hover .micIcon { color: var(--prts-ink-dim); }
.voiceBtn.on .micIcon { color: var(--prts-ink); }
.voiceBtn.recognizing .micIcon { color: var(--prts-ink); animation: prts-shimmer 1.2s linear infinite; }

/* ===== Plugin bar (community dsh plugin buttons) ===== */
.pluginBar { display: inline-flex; align-items: center; gap: 4px; }
.pluginBar:empty { display: none; }
.pluginBtn {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border: 1px solid var(--prts-hairline);
  border-radius: 15px; background: transparent; color: var(--prts-ink-dim);
  cursor: pointer; transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease);
}
.pluginBtn:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.pluginBtn svg { width: 14px; height: 14px; }
.pluginBtn .pluginBadge {
  position: absolute; top: -2px; right: -2px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--prts-ink); opacity: 0.85;
}

/* ===== System panel ===== */
.sysOverlay { z-index: 120; }
.sysCard {
  width: min(920px, calc(100vw - 64px)); max-height: calc(100vh - 64px); overflow: hidden;
  background: var(--prts-panel); border: 1px solid var(--prts-hairline); border-radius: 12px;
  box-shadow: var(--prts-shadow); display: flex; flex-direction: column;
  transform: translateY(10px) scale(0.99); transition: transform 0.24s var(--prts-ease-out);
}
.overlay.open .sysCard { transform: translateY(0) scale(1); }
.sysHead {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 12px 18px; border-bottom: 1px solid var(--prts-hairline);
}
.sysTitle {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 13px; letter-spacing: 0.28em; font-weight: 500; color: var(--prts-ink);
}
.rhombus-s {
  display: inline-block; width: 9px; height: 9px; transform: rotate(45deg);
  border: 1.2px solid var(--prts-diamond); flex: none;
}
.sysSlash { color: var(--prts-ink-faint); letter-spacing: 0; }
.sysBody {
  display: grid; grid-template-columns: minmax(240px, 38%) 1fr; gap: 0; min-height: 0; overflow: hidden;
}
.sysVisual {
  position: relative; display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--prts-hairline); min-height: 300px; padding: 24px;
  overflow: hidden;
}
#sysRing { width: 100%; max-width: 300px; aspect-ratio: 1; display: block; }
.sysVisualTag {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
}
.sysVisualWord {
  font-size: 20px; font-weight: 600; font-style: italic; letter-spacing: 0.3em;
  color: var(--prts-ink); text-indent: 0.3em;
}

/* fastfetch / btop-style telemetry: one space, line-divided blocks. */
.sysStats {
  display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0; min-width: 0;
  overflow-y: auto; padding: 16px 18px 18px;
}
.sysBlock { min-width: 0; padding: 0 14px; }
.sysBlock:first-child { padding-left: 0; }
.sysBlock:last-child { padding-right: 0; }
.sysDivider { background: var(--prts-hairline); margin: 2px 0; }
.sysBlockTitle {
  padding-bottom: 8px; margin-bottom: 4px;
  border-bottom: 1px solid var(--prts-hairline);
  letter-spacing: 0.34em;
}
.sysRows { display: flex; flex-direction: column; }
.sysRow {
  display: grid; grid-template-columns: 86px 1fr; column-gap: 10px; align-items: center;
  min-height: 28px; padding: 5px 0;
  border-bottom: 1px solid var(--prts-hairline);
}
.sysRow:last-child { border-bottom: none; }
.sysK {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--prts-ink-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sysV { text-align: right; min-width: 0; }
.sysVal {
  font-family: var(--prts-mono); font-size: 13px; line-height: 20px; color: var(--prts-ink);
  font-variant-numeric: tabular-nums; word-break: break-word;
}
.sysBar {
  grid-column: 1 / -1; height: 2px; margin-top: -2px;
  border-radius: 1px; background: var(--prts-hairline); overflow: hidden;
}
.sysBarFill {
  height: 100%; border-radius: 1px; background: var(--prts-ink);
  transition: none;
}

/* ===== Small screens: stack the system panel ===== */
@media (max-width: 760px) {
  .sysBody { grid-template-columns: 1fr; }
  .sysVisual { border-right: none; border-bottom: 1px solid var(--prts-hairline); min-height: 220px; }
  .sysStats { grid-template-columns: 1fr; }
  .sysDivider { display: none; }
  .sysBlock { padding: 0; }
  .sysBlock:last-child { border-top: 1px solid var(--prts-hairline); margin-top: 12px; padding-top: 10px; }
}

/* 0.5.0 system panel: 3D logo + restructured stats */
.sysVisual { perspective: 900px; }
.sys3d {
  width: 148px; height: 148px; object-fit: contain; transform-style: preserve-3d;
  filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.55));
  will-change: transform;
}
.sysOverlay .sysCard {
  background: color-mix(in srgb, var(--prts-panel) 82%, transparent);
  backdrop-filter: blur(var(--prts-glass-strong, 20px)); -webkit-backdrop-filter: blur(var(--prts-glass-strong, 20px));
}
.sysStats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
@media (max-width: 760px) { .sysStats { grid-template-columns: 1fr; } }
.sysRows { display: flex; flex-direction: column; gap: 6px; }
.sysRow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 110px; align-items: center; gap: 8px; }
.sysK { font-size: 11px; color: var(--prts-ink-faint); letter-spacing: 0.06em; }
.sysV { font-size: 12px; color: var(--prts-ink); font-family: var(--prts-mono); text-align: right; }
.sysBar { height: 4px; border-radius: 2px; background: var(--prts-hairline); overflow: hidden; }
.sysBarFill { height: 100%; width: 0; background: var(--prts-accent); transition: width 0.2s var(--prts-ease); }

/* ---------- mobile touch targets ---------- */
@media (max-width: 760px) {
  .chip, .sbBtn, .sbFootItem, .crumb, .tab, .bulkBtn, .sBtn {
    min-height: 40px;
  }
  .composerToolbar .meterBtn, .composerToolbar .chip { min-height: 38px; padding: 0 12px; }
  .heroWord { font-size: 34px !important; }
  .heroLogo .rhombus-lg { width: 40px; height: 40px; }
}

/* PRTS frame layout: sidebar / main / details, all hairline-divided. */
html, body { height: 100%; }
/* Author CSS sets display on many components; make the hidden attribute
   authoritative again (settings collapse, attach strip, chips, bulk bar…). */
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--prts-font);
  font-size: 14px;
  line-height: 24px;
  color: var(--prts-ink);
  background: var(--prts-bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
button { font-family: inherit; color: inherit; }
input, textarea, select { font-family: inherit; }
svg { display: block; flex: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 1px solid var(--prts-ink);
  outline-offset: 2px;
}
button:focus:not(:focus-visible) { outline: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--prts-hairline-strong); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--prts-ink-faint); }
::-webkit-scrollbar-track { background: transparent; }

.frame {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--dsh-sb, 272px) minmax(0, 1fr) var(--dsh-dt, 0px);
  height: 100%;
  overflow: hidden;
  background: transparent;
  transition: grid-template-columns var(--prts-drawer-ms, 300ms) var(--prts-ease);
}
html[data-prts-drawer-off] .frame { transition: grid-template-columns 0s; }
/* Custom wallpaper layer: sits under the whole frame (z-index 0) so the
   background diamond/square marks in the conversation column stay on top. */
#wallpaperLayer {
  position: fixed; inset: 0; z-index: 0; overflow: hidden;
  background: var(--prts-bg); pointer-events: none;
}
#wallpaperLayer img, #wallpaperLayer video { display: block; }
.frame[data-dragging] { transition: none; }

.sbCol { min-width: 0; overflow: hidden; background: var(--prts-panel); border-right: 1px solid var(--prts-hairline); transition: border-color 0.3s var(--prts-ease); }
.frame.sbCollapsed .sbCol { border-right-color: transparent; }
.ctCol { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.dtCol { min-width: 0; overflow: hidden; border-left: 1px solid var(--prts-hairline); background: var(--prts-panel); }
.frame[data-details-collapsed] .dtCol { border-left: none; }
.handle {
  position: absolute; top: 0; bottom: 0; width: 8px; margin-left: -4px;
  cursor: col-resize; z-index: 3; touch-action: none;
  transition: left 0.3s var(--prts-ease);
}
.frame[data-dragging] .handle { transition: none; }
.handle::after {
  content: '';
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 3px; height: 40px; border-radius: 2px;
  background: var(--prts-ink-faint);
  opacity: 0;
  transition: opacity 0.2s var(--prts-ease);
}
.handle:hover::after, .handle[data-dragging='true']::after { opacity: 0.6; }

/* Hairline corner brackets — the PRTS signature frame detail. */
.bracket { position: relative; }
.bracket::before, .bracket::after {
  content: '';
  position: absolute; width: 12px; height: 12px; pointer-events: none;
}
.bracket::before {
  top: -1px; left: -1px;
  border-top: 1px solid var(--prts-hairline-strong);
  border-left: 1px solid var(--prts-hairline-strong);
}
.bracket::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid var(--prts-hairline-strong);
  border-right: 1px solid var(--prts-hairline-strong);
}

/* Wide-tracked micro labels (Arknights-style eyebrows). */
.eyebrow {
  font-size: 10px; line-height: 16px; letter-spacing: 0.32em;
  text-transform: uppercase; color: var(--prts-ink-faint);
  font-weight: 500; white-space: nowrap;
}
.mono { font-family: var(--prts-mono); font-variant-numeric: tabular-nums; }

/* Icon button. */
.iconBtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0; border: none; border-radius: 8px;
  background: transparent; color: var(--prts-ink-dim); cursor: pointer;
}
.iconBtn:hover { background: var(--prts-surface-2); color: var(--prts-ink); }

/* Toast. */
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 200;
  transform: translateX(-50%) translateY(8px);
  padding: 8px 18px; border-radius: 4px;
  background: var(--prts-invert-bg); color: var(--prts-invert-ink);
  font-size: 13px; line-height: 20px; letter-spacing: 0.04em;
  opacity: 0; pointer-events: none;
  box-shadow: var(--prts-shadow);
  transition: opacity 0.2s var(--prts-ease), transform 0.2s var(--prts-ease);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- mobile (<=760px): off-canvas sidebar, full-width conversation ---------- */
@media (max-width: 760px) {
  .frame { grid-template-columns: 0 minmax(0, 1fr) 0 !important; }
  .handle { display: none !important; }
  .sbCol {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 70;
    width: min(300px, 84vw);
    transform: translateX(-102%);
    transition: transform 0.25s var(--prts-ease);
    box-shadow: 0 0 48px rgba(0, 0, 0, 0.55);
    border-right: 1px solid var(--prts-hairline-strong);
  }
  .frame.mobileNavOpen .sbCol { transform: translateX(0); }
  .dtCol {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 70;
    width: min(340px, 92vw);
    transition: transform 0.25s var(--prts-ease);
    box-shadow: -6px 0 40px rgba(0, 0, 0, 0.5);
  }
  .frame[data-details-collapsed] .dtCol { transform: translateX(103%); }
  .sbToggleBtn { width: 36px; height: 36px; z-index: 80; }
  .iconBtn { width: 36px; height: 36px; }
  .composerInput { font-size: 16px !important; } /* prevent iOS auto-zoom */
  .tab { padding: 0 14px; }
}

/* ===== PRTS panels: settings nav, balance, git, skill dock, market =====
   Built on the chat.css settings primitives; Hypergryph-style chrome:
   hairline section titles, diamond glyphs, mono uppercase micro-labels. */

/* ---------- settings overlay: official-style section nav ---------- */
#settingsOverlay .settingsCard {
  width: min(860px, calc(100vw - 48px));
  height: min(620px, calc(100vh - 80px));
  display: flex; flex-direction: column; overflow: hidden;
  padding: 18px 0 0;
}
#settingsOverlay .settingsHead { padding: 0 20px; margin-bottom: 12px; }
#settingsOverlay .settingsBody {
  flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 0;
  border-top: 1px solid var(--prts-hairline);
}
.sNav {
  width: 172px; flex: none; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px;
  border-right: 1px solid var(--prts-hairline); background: var(--prts-surface);
  overflow-y: auto;
}
.sNavItem {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border: none; border-radius: 8px; background: transparent; cursor: pointer;
  color: var(--prts-ink-dim); font-size: 13px; text-align: left;
  transition: background 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.sNavItem svg { flex: none; opacity: 0.8; }
.sNavItem:hover { background: var(--prts-surface-2); color: var(--prts-ink); }
.sNavItem.on {
  background: var(--prts-surface-2); color: var(--prts-ink);
  box-shadow: inset 2px 0 0 var(--prts-ink);
}
.sNavItem .pState { margin-left: auto; }
.sContent {
  flex: 1; min-width: 0; overflow-y: auto; padding: 16px 20px 24px;
  display: flex; flex-direction: column;
}
.sSectionHost { display: flex; flex-direction: column; gap: 18px; }
.sContent .sSection { display: flex; flex-direction: column; gap: 8px; }
.sTextarea {
  width: 100%; min-height: 320px; padding: 10px 12px; border: 1px solid var(--prts-hairline);
  border-radius: 8px; background: var(--prts-surface); color: var(--prts-ink);
  font-family: var(--prts-mono); font-size: 12px; line-height: 1.6; resize: vertical; outline: none;
}
.sTextarea:focus { border-color: var(--prts-hairline-strong); }
.inlineForm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inlineForm .sInput { flex: 1; min-width: 140px; }

/* ---------- balance card ---------- */
.balCard {
  display: flex; align-items: center; gap: 16px; padding: 14px 16px;
  border: 1px solid var(--prts-hairline); border-radius: 10px; background: var(--prts-surface);
}
.balBig {
  font-family: var(--prts-mono); font-size: 26px; letter-spacing: 0.02em; color: var(--prts-ink);
}
.balSub { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.balSub .projectRow { margin-bottom: 0; }

/* ---------- git panel ---------- */
.ghUser { display: flex; align-items: center; gap: 8px; }
.ghUser svg { color: var(--prts-ink-dim); }
.ghLogin { font-family: var(--prts-mono); font-size: 13px; color: var(--prts-ink); }
.ghHeat {
  margin-top: 4px; padding: 10px 12px; border: 1px solid var(--prts-hairline); border-radius: 10px;
  background: var(--prts-surface); overflow-x: auto;
}
.ghHeat svg { display: block; min-width: 560px; }
.mCheck { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--prts-ink-dim); cursor: pointer; }
.mCheck input { accent-color: var(--prts-ink); }

/* ---------- skill dock ---------- */
.skPersona, .skChips { display: flex; flex-wrap: wrap; gap: 6px; }
.skChip {
  height: 26px; padding: 0 12px; border: 1px solid var(--prts-hairline); border-radius: 13px;
  background: transparent; color: var(--prts-ink-dim); font-size: 12px; cursor: pointer;
  transition: border-color 0.12s var(--prts-ease), color 0.12s var(--prts-ease), background 0.12s var(--prts-ease);
}
.skChip:hover { border-color: var(--prts-hairline-strong); color: var(--prts-ink); }
.skChip.on { background: var(--prts-ink); color: var(--prts-bg); border-color: var(--prts-ink); }
.skGroup {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin-top: 4px;
  border: 1px solid var(--prts-hairline); border-radius: 8px; background: transparent;
  transition: border-color 0.12s var(--prts-ease);
}
.skGroup.active { border-color: var(--prts-hairline-strong); background: var(--prts-surface); }
.skGroupName {
  flex: 1; text-align: left; border: none; background: transparent; cursor: pointer;
  color: var(--prts-ink); font-size: 13px; font-family: var(--prts-mono); letter-spacing: 0.06em;
}
.skGroupCount { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.skGroup .rowBtn { color: var(--prts-ink-faint); }
.skItem {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 1px solid var(--prts-hairline); border-radius: 8px;
}
.skItemMeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.skItemName { font-size: 13px; color: var(--prts-ink); font-family: var(--prts-mono); }
.skItemMeta .pModels { font-family: inherit; }
.skItem .rowBtn {
  display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
  border: 1px solid var(--prts-hairline); border-radius: 6px; background: transparent;
  color: var(--prts-ink-faint); cursor: pointer;
}
.skItem .rowBtn:hover { color: var(--prts-ink); border-color: var(--prts-hairline-strong); }

/* ---------- market ---------- */
.marketCard { width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; overflow: hidden; }
.marketCard .settingsHead { flex: none; }
#marketList { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.mControls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mSearch {
  flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; height: 34px;
  padding: 0 10px; border: 1px solid var(--prts-hairline); border-radius: 6px; color: var(--prts-ink-faint);
}
.mSearch:focus-within { border-color: var(--prts-hairline-strong); color: var(--prts-ink-dim); }
.mSearch input { flex: 1; min-width: 0; border: none; background: transparent; color: var(--prts-ink); font-size: 13px; outline: none; }
.mTabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--prts-hairline); border-radius: 8px; background: var(--prts-surface); }
.mTab {
  height: 26px; padding: 0 14px; border: none; border-radius: 6px; background: transparent;
  color: var(--prts-ink-dim); font-size: 12px; letter-spacing: 0.08em; cursor: pointer;
  transition: background 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.mTab.on { background: var(--prts-ink); color: var(--prts-bg); }
.mCats { display: flex; gap: 6px; flex-wrap: wrap; }
.mCat {
  height: 24px; padding: 0 12px; border: 1px solid var(--prts-hairline); border-radius: 12px;
  background: transparent; color: var(--prts-ink-faint); font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
  transition: border-color 0.12s var(--prts-ease), color 0.12s var(--prts-ease);
}
.mCat.on { border-color: var(--prts-ink); color: var(--prts-ink); }
.mGh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border: 1px dashed var(--prts-hairline-strong); border-radius: 8px; }
.mGhLabel { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--prts-ink-faint); flex: 1; min-width: 120px; }
.mGh .sInput { flex: 2; min-width: 220px; }
.mGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.mGrid .pCard { margin-bottom: 0; }
.mLink { font-size: 11px; font-family: var(--prts-mono); color: var(--prts-ink-faint); text-decoration: none; word-break: break-all; }
.mLink:hover { color: var(--prts-ink); }
.marketCard .pCardHead { cursor: default; }

/* ---------- plugin inventory groups ---------- */
.pGroup { border: 1px solid var(--prts-hairline); border-radius: 8px; padding: 8px 12px 2px; }
.pGroupHead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.pGroupHead .pname { flex: 1; font-size: 11px; letter-spacing: 0.16em; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.pGroup .projectRow { margin-bottom: 6px; }

/* ---------- shared hint / rows ---------- */
.hint { font-size: 11px; line-height: 18px; color: var(--prts-ink-faint); }
#gitOverlay .settingsCard, #skillOverlay .settingsCard { width: min(640px, calc(100vw - 48px)); }
#gitBody, #skillBody { display: flex; flex-direction: column; gap: 18px; }

/* ---------- 0.4.0: plugins two-column page (official layout) ---------- */
.sPluginsGrid {
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 18px; align-items: start;
}
@media (max-width: 720px) { .sPluginsGrid { grid-template-columns: 1fr; } }
.sPluginsLeft, .sPluginsRight { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sPluginList { display: flex; flex-direction: column; gap: 4px; }
.sPluginRow {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px;
  border: 1px solid var(--prts-hairline); border-radius: 8px;
}
.sPluginMeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sPluginMeta .pname { font-size: 13px; color: var(--prts-ink); word-break: break-all; }
.sPluginMeta .pmeta { font-size: 11px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.mSwitch {
  flex: none; height: 24px; padding: 0 10px; border: 1px solid var(--prts-hairline);
  border-radius: 12px; background: transparent; color: var(--prts-ink-faint);
  font-size: 10px; letter-spacing: 0.12em; font-family: var(--prts-mono); cursor: pointer;
  transition: all 0.12s var(--prts-ease);
}
.mSwitch.on { background: var(--prts-accent); border-color: var(--prts-accent); color: var(--prts-bg); }
.cfgField { display: flex; align-items: center; gap: 8px; }
.cfgField .fLabel { flex: 1; min-width: 90px; font-size: 12px; color: var(--prts-ink-dim); }
.fLabel { font-size: 12px; color: var(--prts-ink-dim); flex: none; }
.cfgField .sInput { flex: 2; min-width: 0; height: 30px; }

/* ---------- 0.4.0: models page rows (official row-card shape) ---------- */
.sRows { display: flex; flex-direction: column; gap: 8px; }
.sRows .pCardHead { cursor: pointer; }
.credDot {
  flex: none; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(247, 118, 142, 0.9);
}
.credDot.ok { background: #9ece6a; }
.mCatalog { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; border-top: 1px solid var(--prts-hairline); }
.mCatalogTitle { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--prts-ink-faint); }
.skChipX {
  margin-left: 6px; padding: 0 4px; border: none; background: transparent; cursor: pointer;
  color: inherit; opacity: 0.65; font-size: 12px; line-height: 1;
}
.skChipX:hover { opacity: 1; }
.sCustomForm { display: flex; flex-direction: column; gap: 8px; }
.sCollapse { display: flex; flex-direction: column; gap: 8px; }

/* ---------- 0.4.0: accent colors + wallpaper controls ---------- */
.accPickers { display: flex; flex-wrap: wrap; gap: 14px; }
.accPick { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.accPick input[type='color'] {
  width: 34px; height: 26px; padding: 0; border: 1px solid var(--prts-hairline);
  border-radius: 6px; background: transparent; cursor: pointer;
}
.accRange { flex: 1; min-width: 140px; accent-color: var(--prts-accent); }
.accNum { width: 90px; flex: none; }

/* ---------- 0.4.0: skills page rework (official list style) ---------- */
.skCard { border: 1px solid var(--prts-hairline); border-radius: 8px; overflow: hidden; }
.skRow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.skMark { flex: none; color: var(--prts-diamond); opacity: 0.85; }
.skMark svg { width: 10px; height: 10px; }
.skNameLine { display: flex; align-items: center; gap: 8px; min-width: 0; }
.skDesc {
  font-size: 11px; line-height: 17px; color: var(--prts-ink-faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.skActions { flex: none; display: flex; align-items: center; gap: 6px; }
.skEditor { padding: 10px 12px 12px; border-top: 1px solid var(--prts-hairline); background: var(--prts-surface); }
.skEditor .sTextarea { min-height: 200px; }
.skEditor .sRow { justify-content: flex-end; }

/* ---------- 0.5.0: liquid glass + fixed-height scrolling ---------- */
/* Glass on the composer, chips, popovers and the message/trajectory surfaces */
.composerCard {
  background: color-mix(in srgb, var(--prts-panel) 70%, transparent) !important;
  backdrop-filter: blur(var(--prts-glass-strong, 20px)); -webkit-backdrop-filter: blur(var(--prts-glass-strong, 20px));
}
.chip, .pop, .modalCard, .reqCard, .mTabs, .mSearch, .mGh, .skCard, .pCard, .mCat, .skChip {
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
}
.pop { background: color-mix(in srgb, var(--prts-panel) 85%, transparent); }
/* conversation surfaces stay UN-glassed so the background
   diamond/square marks stay visible behind the text */
/* Wallpaper active: the sidebar and details columns turn translucent glass */
body[data-wallpaper='on'] .sbCol,
body[data-wallpaper='on'] .dtCol {
  background: color-mix(in srgb, var(--prts-panel) 55%, transparent);
  backdrop-filter: blur(var(--prts-glass-strong, 20px)); -webkit-backdrop-filter: blur(var(--prts-glass-strong, 20px));
}
body[data-wallpaper='on'] .sysCard,
body[data-wallpaper='on'] .settingsCard {
  background: color-mix(in srgb, var(--prts-panel) 68%, transparent);
}
/* Market keeps its size no matter how many plugins: inner scroll only */
.marketCard {
  width: min(760px, calc(100vw - 48px));
  height: min(680px, calc(100vh - 80px));
  display: flex; flex-direction: column; overflow: hidden;
}
.marketCard .settingsHead { flex: none; }
#marketList { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
#marketList .mGrid { overflow: visible; }
/* Skills: space wins over text — long labels truncate, never overflow */
.skActions .sBtn { max-width: 132px; }
.skRow .skItemMeta { min-width: 0; flex: 1; }
.skNameLine .skItemName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sNavItem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 0.5.0: message meta/actions, path links, tool body ---------- */
.assistantItem { position: relative; }
.msgMeta {
  display: flex; gap: 6px; font-size: 10px; color: var(--prts-ink-faint);
  font-family: var(--prts-mono); opacity: 0; transition: opacity 0.16s var(--prts-ease);
  margin-top: 4px;
}
.assistantItem:hover .msgMeta { opacity: 1; }
.msgActions {
  position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
  opacity: 0; transform: translateY(-3px);
  transition: opacity 0.16s var(--prts-ease), transform 0.16s var(--prts-ease);
  padding: 2px; border-radius: 8px;
  background: color-mix(in srgb, var(--prts-panel) 78%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
}
.assistantItem:hover .msgActions { opacity: 1; transform: none; }
.maBtn {
  width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--prts-hairline); border-radius: 6px; background: transparent;
  color: var(--prts-ink-dim); cursor: pointer;
  transition: color 0.12s var(--prts-ease), border-color 0.12s var(--prts-ease);
}
.maBtn:hover { color: var(--prts-accent); border-color: var(--prts-hairline-strong); }
.maBtn.on { color: var(--prts-accent); border-color: var(--prts-accent); }
.maBtn svg { width: 13px; height: 13px; }
.pathLink { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--prts-accent); }
.pathLink:hover { filter: brightness(1.25); }
.toolBody { max-height: 260px; overflow-y: auto; }
.toolItem .dRow:hover { border-color: var(--prts-hairline-strong); }

/* ---------- 0.5.0: trajectory (colored blocks + search) ---------- */
.trajView { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; padding: 10px 14px 18px; }
.tlSearch {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 10px; margin-bottom: 8px;
  border: 1px solid var(--prts-hairline); border-radius: 8px;
  background: color-mix(in srgb, var(--prts-panel) 82%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
  color: var(--prts-ink-faint);
}
.tlSearch input { flex: 1; min-width: 0; border: none; background: transparent; color: var(--prts-ink); font-size: 13px; outline: none; }
.tlHead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 10px; padding: 4px 6px 4px 10px;
  border-left: 2px solid var(--prts-hairline-strong);
}
.tlLabel { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.tlRow {
  display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 3px 8px 3px 10px;
  border-radius: 6px;
}
.tlRow:hover { background: var(--prts-surface-2); }
.tlBar { flex: none; width: 3px; height: 16px; border-radius: 2px; }
.tlType { flex: none; font-size: 10px; letter-spacing: 0.08em; font-family: var(--prts-mono); opacity: 0.9; min-width: 62px; }
.tlBrief {
  flex: 1; min-width: 0; font-size: 11px; color: var(--prts-ink-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--prts-mono);
}
.tlMeta { flex: none; display: flex; gap: 6px; font-size: 10px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }

/* ---------- 0.5.0: presets rows + full inventory list ---------- */
.sPresetRow {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--prts-hairline); border-radius: 10px;
  background: color-mix(in srgb, var(--prts-surface) 60%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px)); -webkit-backdrop-filter: blur(var(--prts-glass, 12px));
}
.sPresetRow.current { border-color: var(--prts-accent); }
.invList {
  display: flex; flex-direction: column; gap: 4px;
  max-height: 430px; overflow-y: auto; padding-right: 4px;
}
.invList .pmeta { font-size: 10px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }

/* ---------- 0.6.0: PRTS send button, animations, theme-linked accents ---------- */
.sendBtn {
  position: relative; width: 34px; height: 34px; padding: 0;
  border: 1.2px solid var(--prts-accent); border-radius: 9px;
  background: transparent; color: var(--prts-accent); cursor: pointer;
  transform: rotate(45deg);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.18s var(--prts-ease), box-shadow 0.18s var(--prts-ease), opacity 0.18s var(--prts-ease);
}
.sendBtn svg { transform: rotate(-45deg); }
.sendBtn:hover:not(:disabled) { background: color-mix(in srgb, var(--prts-accent) 16%, transparent); }
.sendBtn:disabled { opacity: 0.35; cursor: default; }
/* send pulse: a diamond ripple fires on every send */
@keyframes prtsSendPulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--prts-accent) 55%, transparent); }
  100% { box-shadow: 0 0 0 14px transparent; }
}
.sendBtn.sent { animation: prtsSendPulse 0.55s var(--prts-ease-out) 1; }
/* running state: becomes a stop square with a breathing halo */
.sendBtn.running { transform: rotate(45deg); border-color: var(--prts-accent); }
.sendBtn.running svg { transform: rotate(-45deg); animation: prtsStopSpin 1.6s linear infinite; }
@keyframes prtsStopSpin { to { transform: rotate(-405deg); } }
@keyframes prtsRunningHalo {
  0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--prts-accent) 45%, transparent); }
  50% { box-shadow: 0 0 16px color-mix(in srgb, var(--prts-accent) 80%, transparent); }
}
.sendBtn.running { animation: prtsRunningHalo 1.4s ease-in-out infinite; }
/* voice button follows the accent */
.voiceBtn { color: var(--prts-accent); }
.voiceBtn.on { border-color: var(--prts-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--prts-accent) 35%, transparent); }
/* disclosure chevrons: accent color + rotation animation */
.dRow .chev, .dRow svg { color: var(--prts-accent); transition: transform 0.25s var(--prts-ease-out); }
.disclosure.open .dRow svg.chev, .openArgs .dRow svg:first-child { transform: rotate(90deg); }
.disclosure.open .dRow svg, .toolItem.openArgs .dRow svg { transform: rotate(90deg); }
/* message actions live inline at the end of the output (bottom-right) */
.msgActions {
  position: static; display: inline-flex; gap: 4px; opacity: 0;
  transform: none; margin-left: 6px; vertical-align: bottom;
  background: transparent; padding: 0;
  transition: opacity 0.16s var(--prts-ease);
}
.assistantItem:hover .msgActions { opacity: 1; }
.maBtn { border: none; background: transparent; color: var(--prts-ink-faint); }
.maBtn:hover { color: var(--prts-accent); border-color: transparent; }
.maBtn.on { color: var(--prts-accent); }
.maBtn svg { width: 12px; height: 12px; }
/* deliverables: produced files at the reply's end, light up on hover */
.dlvChips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dlvChip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border: 1px solid var(--prts-hairline); border-radius: 13px;
  background: color-mix(in srgb, var(--prts-surface) 60%, transparent);
  color: var(--prts-ink-dim); font-size: 11px; font-family: var(--prts-mono); cursor: pointer;
  max-width: 240px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  transition: border-color 0.15s var(--prts-ease), color 0.15s var(--prts-ease), box-shadow 0.15s var(--prts-ease);
}
.dlvChip svg { flex: none; width: 11px; height: 11px; color: var(--prts-accent); }
.dlvChip:hover {
  border-color: var(--prts-accent); color: var(--prts-ink);
  box-shadow: 0 0 12px color-mix(in srgb, var(--prts-accent) 35%, transparent);
}
/* waveform above the trajectory */
.tlWave { margin-bottom: 6px; padding: 8px 10px; border: 1px solid var(--prts-hairline); border-radius: 10px; background: color-mix(in srgb, var(--prts-surface) 55%, transparent); }
.tlWaveLegend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
.tlWaveKey { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--prts-ink-faint); font-family: var(--prts-mono); }
.tlWaveDot { width: 7px; height: 7px; border-radius: 2px; }
/* theme toggle third state (colored diamond) */
.themeDiamond { opacity: 0; transform: rotate(-60deg) scale(0.6); }
[data-theme='custom'] .themeDiamond { opacity: 1; transform: rotate(0) scale(1); }
[data-theme='custom'] .themeSun, [data-theme='custom'] .themeMoon { opacity: 0; transform: rotate(60deg) scale(0.6); }
/* active session/workspace marker follows the accent (small diamond) */
.sbItem.active { box-shadow: none; position: relative; }
.sbItem.active::before {
  content: ''; position: absolute; left: 4px; top: 50%; width: 6px; height: 6px;
  transform: translateY(-50%) rotate(45deg); background: var(--prts-accent);
  box-shadow: 0 0 6px color-mix(in srgb, var(--prts-accent) 55%, transparent);
}
.sbItem.active .name { color: var(--prts-ink); }
/* header jobs chip */
.jobsChip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; position: relative; }
.jobsCount { font-family: var(--prts-mono); color: var(--prts-accent); }
.jobsPop { min-width: 220px; max-width: 320px; max-height: 300px; overflow-y: auto; }
/* static header chips (pure labels) */
.chip.static { cursor: default; }
.chip.static:hover { background: transparent; }
.modeChipIcon { display: inline-flex; flex: none; }
.modeChipIcon svg { width: 12px; height: 12px; color: var(--prts-accent); }
.permIcon { display: inline-flex; flex: none; margin-right: 4px; }
.permIcon svg { width: 12px; height: 12px; color: var(--prts-accent); }
