/* sidebar smoothness: content-visibility + lighter transition */
.sbList { content-visibility: auto; contain-intrinsic-size: 32px 40px; }
.frame { transition: grid-template-columns 0.22s var(--prts-ease-out); will-change: grid-template-columns; }
.sbCol { transition: border-color 0.3s var(--prts-ease), width 0.22s var(--prts-ease-out); }
/* system panel: single-column horizontal rows (no vertical text) */
.sysStats { display: flex; flex-direction: column; gap: 14px; }
.sysRow { grid-template-columns: 110px minmax(0, 1fr) 150px; }
.sysK { font-size: 12px; white-space: nowrap; }
.sysV { font-size: 12px; white-space: nowrap; }

/* ---------- 0.6.1: polish round ---------- */
/* composer expand toggle: accent + self-shifting gradient */
.expandBtn { color: var(--prts-accent); }
@keyframes accentShift {
  0%, 100% { color: var(--prts-accent); }
  50% { color: var(--prts-diamond); }
}
/* selected session/workspace: right stroke + glow (no diamond) */
.sbItem.active::before { display: none; }
.sbItem.active {
  background: var(--prts-surface-2);
  box-shadow: inset 2px 0 0 var(--prts-accent),
    inset 0 0 14px color-mix(in srgb, var(--prts-accent) 10%, transparent);
}
.sbItem.active .name { color: var(--prts-ink); }
/* static header chips: no chevron, no hover glow */
.chip.static { cursor: default; }
.chip.static:hover { background: transparent; border-color: var(--prts-hairline); color: inherit; }
.chip.static .chev { display: none; }
/* theme toggle: make it visible, accent-tinted */
.themeBtn {
  border: 1px solid var(--prts-hairline); border-radius: 8px; color: var(--prts-accent);
  background: color-mix(in srgb, var(--prts-surface) 55%, transparent);
}
.themeBtn:hover { border-color: var(--prts-accent); }
/* sidebar footer: overflow hides into a row that pops open on hover */
.sbFoot {
  flex-wrap: wrap; max-height: 46px; overflow: hidden;
  transition: max-height 0.22s var(--prts-ease-out);
}
.sbFoot:hover { max-height: 260px; }
/* skill rows: name wins the space, nothing can cover the buttons */
.skRow { align-items: center; }
.skItemMeta { overflow: hidden; }
.skNameLine { overflow: hidden; flex-wrap: nowrap; }
.skNameLine .pState { flex: none; }
/* sidebar view toggle (dsh-web parity) — animated collapse: the section
   row shrinks via grid-template-rows, content slides and fades in sync */
.sbViewIcon svg { width: 12px; height: 12px; }
.sbSection {
  display: grid; grid-template-rows: 1fr;
  transition: grid-template-rows var(--prts-drawer-ms, 350ms) cubic-bezier(.2,.8,.25,1);
}
.sbSectionInner { overflow: hidden; min-height: 0; }
.sbSectionSessions {
  flex: 1 1 0; min-height: 0;
  transition: grid-template-rows var(--prts-drawer-ms, 350ms) cubic-bezier(.2,.8,.25,1), flex-grow var(--prts-drawer-ms, 350ms) cubic-bezier(.2,.8,.25,1), opacity .25s ease;
}
.sbSectionSessions .sbSectionInner { display: flex; flex-direction: column; min-height: 0; }
.frame[data-sbview='workspaces'] .sbSectionSessions,
.frame[data-sbview='sessions'] .sbSectionWorkspaces { grid-template-rows: 0fr; opacity: 0; }
.frame[data-sbview='workspaces'] .sbSectionSessions { flex-grow: 0; }

/* ---------- 0.7.0: webUI-render parity ---------- */
/* colors: think grey, errors red, main output pure ink */
.thinkBody { color: var(--prts-ink-dim); }
.errText { color: #f7768e; }
.para { color: var(--prts-ink); }
/* emoji → monochrome rendered marks (webUI style) */
.emoji { font-style: normal; filter: grayscale(1) brightness(1.55) contrast(1.05); }
[data-theme='light'] .emoji { filter: grayscale(1) brightness(0.35) contrast(1.1); }
/* markdown tables scroll both ways (webUI parity) */
.tblWrap { max-height: 320px; overflow: auto; margin: 6px 0; border: 1px solid var(--prts-hairline); border-radius: 8px; }
.tblWrap table { border-collapse: collapse; min-width: 100%; font-size: 12px; font-family: var(--prts-mono); }
.tblWrap th, .tblWrap td { border-bottom: 1px solid var(--prts-hairline); padding: 5px 10px; text-align: left; white-space: nowrap; }
.tblWrap th { color: var(--prts-accent); font-weight: 600; }
/* persistent message footer: meta + big actions, bottom-right of the OUTPUT */
.msgFoot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 6px; }
.msgMeta { display: flex; gap: 6px; font-size: 10px; color: var(--prts-ink-faint); font-family: var(--prts-mono); margin: 0; opacity: 1; }
.msgActions { display: inline-flex; gap: 6px; opacity: 1; position: static; transform: none; margin: 0; background: transparent; padding: 0; }
.maBtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--prts-hairline); background: color-mix(in srgb, var(--prts-surface) 55%, transparent); color: var(--prts-ink-dim); }
.maBtn svg { width: 16px; height: 16px; }
.maBtn:hover { color: var(--prts-accent); border-color: var(--prts-accent); }
/* tool blocks (Bash/Read/Edit cards) */
.toolBlock { margin: 6px 0; border: 1px solid var(--prts-hairline); border-radius: 8px; overflow: hidden; }
.toolBlock .dRow { width: 100%; }
.toolBlock .dBody { border-top: 1px solid var(--prts-hairline); padding: 8px 10px; }
/* working status glows in the accent color */
.statusRow .shimmer { color: var(--prts-accent); text-shadow: 0 0 12px color-mix(in srgb, var(--prts-accent) 55%, transparent); }

/* ---------- 0.8.0: trajectory rework + block interactions ---------- */
/* tool blocks: dsh-web ToolRow look — compact row, click to expand downward */
.blkRow { border: 1px solid var(--prts-hairline); border-radius: 12px; margin: 4px 0; overflow: hidden; background: color-mix(in srgb, var(--prts-surface) 55%, transparent); }
.blkHead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 10px; border: none; background: transparent; cursor: default; color: var(--prts-ink); min-height: 28px; }
.blkHead:hover { background: var(--prts-surface-2); }
.blkFold {
  width: 20px; height: 20px; margin-left: -3px; padding: 0; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 6px; background: transparent;
  color: var(--prts-ink-faint); cursor: pointer;
  transition: transform 0.18s var(--prts-ease-out), color 0.15s var(--prts-ease), background 0.15s var(--prts-ease);
}
.blkFold:hover { color: var(--prts-accent); background: var(--prts-surface-2); }
.blkFold svg { width: 12px; height: 12px; }
.blkRow.open .blkFold, .toolItem.openArgs .blkFold { transform: rotate(180deg); }
.blkGlyph { display: inline-flex; color: var(--prts-ink-dim); flex: none; }
.blkGlyph svg { width: 13px; height: 13px; }
.dTitle { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--prts-ink); flex: none; }
.blkSummary { flex: 1; min-width: 0; font-size: 11px; font-family: var(--prts-mono); color: var(--prts-ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blkCopy {
  margin-left: 4px; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--prts-hairline); border-radius: 6px; background: transparent;
  color: var(--prts-ink-faint); cursor: pointer; opacity: 0;
  transition: opacity 0.15s var(--prts-ease), color 0.15s var(--prts-ease), border-color 0.15s var(--prts-ease);
}
.blkRow:hover .blkCopy { opacity: 1; }
.blkCopy:hover { color: var(--prts-accent); border-color: var(--prts-accent); }
.blkCopy svg { width: 12px; height: 12px; }
.blkStatus { flex: none; font-size: 10px; line-height: 16px; font-family: var(--prts-mono); color: #f7768e; border: 1px solid color-mix(in srgb, #f7768e 55%, transparent); border-radius: 4px; padding: 0 5px; }
.blkRow.failed { border-color: color-mix(in srgb, #f7768e 45%, var(--prts-hairline)); }
.blkRow.failed .dTitle { color: #f7768e; }
.blkRow .dBody { border-top: 1px solid var(--prts-hairline); max-height: 0; overflow: hidden; padding: 0 10px; transition: max-height 0.28s var(--prts-ease-out), padding 0.28s var(--prts-ease-out); }
.blkRow.open .dBody { max-height: 640px; overflow-y: auto; padding: 10px; }
/* composer expand: hue-flow shimmer (the lost special effect) */
.expandBtn .expandIcon { animation: prtsHue 6s linear infinite; }
.expandBtn .edot { opacity: 1; animation: prtsHue 6s linear infinite, prts-shimmer 1.6s linear infinite; }
@keyframes prtsHue { from { filter: hue-rotate(0deg) brightness(1.15); } to { filter: hue-rotate(360deg) brightness(1.15); } }
/* brand mark: always glowing, hue-flow on hover (custom themes get the full spectrum) */
.brand .rhombus { filter: drop-shadow(0 0 7px var(--prts-diamond)); }
.brand .word { color: var(--prts-accent); text-shadow: 0 0 12px color-mix(in srgb, var(--prts-accent) 45%, transparent); }
.brand:hover .rhombus, .brand:hover .word, .brand:hover .brandFx { animation: prtsHue 4s linear infinite; }
/* trajectory (dsh-web table layout): toolbar + two-column table + details */
.trajBox { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.trajBar {
  flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px;
  height: 32px; border: 1px solid var(--prts-hairline-strong); border-radius: 10px 10px 0 0;
  background: color-mix(in srgb, var(--prts-panel) 78%, transparent);
}
.trajToggle {
  height: 20px; padding: 0 7px; display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--prts-ink-faint); background: transparent; border: none; border-radius: 3px;
  cursor: pointer; flex: none;
}
.trajToggle:hover, .trajToggle.on { color: var(--prts-ink); background: var(--prts-surface-2); }
.trajToggle.on { box-shadow: inset 0 0 0 1px var(--prts-accent); }
.trajSearch {
  margin-left: auto; flex: 0 1 180px; min-width: 84px; height: 22px;
  display: flex; align-items: center; gap: 4px; padding: 0 6px;
  border: 1px solid var(--prts-hairline-strong); border-radius: 4px;
  background: var(--prts-surface-2);
}
.trajSearch:focus-within { border-color: var(--prts-accent); }
.trajSearch svg { width: 12px; height: 12px; color: var(--prts-ink-faint); flex: none; }
.trajSearch input { flex: 1; min-width: 0; border: none; background: transparent; color: var(--prts-ink); font-size: 12px; outline: none; }
.trajSearch input::placeholder { color: var(--prts-ink-faint); }
.trajSplit { flex: 1; min-height: 0; display: flex; border: 1px solid var(--prts-hairline); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
.trajTablePane { flex: 1; min-width: 0; overflow: auto; background: color-mix(in srgb, var(--prts-panel) 55%, transparent); }
.trajTable { border-spacing: 0; table-layout: fixed; width: 100%; min-width: 0; font-size: 12px; color: var(--prts-ink); }
.trajEventCol { width: 130px; }
.trajTable thead th {
  position: sticky; top: 0; z-index: 3; height: 30px; padding: 0 8px;
  text-align: left; font-weight: 500; font-size: 12px; white-space: nowrap;
  color: var(--prts-ink-faint); background: var(--prts-panel);
  border-bottom: 1px solid var(--prts-hairline-strong);
}
.trajTable .trajEventHeader { text-align: right; padding-right: 4px; }
.trajTable td { height: 30px; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--prts-hairline); }
.trajRow { cursor: default; }
.trajRow:hover { background: var(--prts-surface-2); }
.trajRow.sel { background: color-mix(in srgb, var(--prts-accent) 12%, var(--prts-surface-2)); }
.trajRow.sel td { border-bottom-color: transparent; }
.trajEvent { position: relative; padding-left: 36px !important; padding-right: 4px !important; overflow: visible !important; }
.trajEventInner { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.trajTurnLabel {
  position: absolute; top: 0; left: 0; z-index: 2;
  font: 8px/10px var(--prts-mono); font-variant-numeric: tabular-nums;
  color: var(--prts-ink-faint); background: var(--prts-surface-2);
  padding: 1px 5px; border-radius: 0 0 2px; white-space: nowrap;
}
.trajTurnLabel.active {
  color: color-mix(in srgb, var(--prts-accent) 62%, var(--prts-ink-faint));
  background: color-mix(in srgb, var(--prts-accent) 22%, var(--prts-surface));
}
.trajKindSlot { display: flex; flex: none; justify-content: flex-end; align-items: flex-end; gap: 3px; }
.trajKindTag {
  display: inline-flex; align-items: center; height: 19px; padding: 0 5px;
  font-size: 10px; font-weight: 650; line-height: 16px; letter-spacing: 0.035em;
  border: 1px solid transparent; border-radius: 4px; white-space: nowrap; flex: none;
}
.trajCallChip { display: inline-flex; align-items: center; height: 19px; padding: 0 5px; font: 10px/16px var(--prts-mono); color: var(--prts-ink-faint); border: 1px solid var(--prts-hairline); border-radius: 4px; flex: none; }
.trajTime { font: 11px/16px var(--prts-mono); color: var(--prts-ink-faint); flex: none; }
.trajKindUser { color: #7aa2f7; background: color-mix(in srgb, #7aa2f7 14%, var(--prts-surface)); border-color: color-mix(in srgb, #7aa2f7 30%, transparent); }
.trajKindAssistant { color: #bb9af7; background: color-mix(in srgb, #bb9af7 13%, var(--prts-surface)); border-color: color-mix(in srgb, #bb9af7 28%, transparent); }
.trajKindTool { color: #e0af68; background: color-mix(in srgb, #e0af68 14%, var(--prts-surface)); border-color: color-mix(in srgb, #e0af68 30%, transparent); }
.trajKindError { color: #f7768e; background: color-mix(in srgb, #f7768e 14%, var(--prts-surface)); border-color: color-mix(in srgb, #f7768e 34%, transparent); }
.trajContent { padding-left: 4px !important; }
.trajContentText { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--prts-ink); }
.trajRow[data-error='true'] .trajContentText { color: #f7768e; }
.trajRight {
  flex: none; width: clamp(320px, 38%, 440px); min-width: 0; max-width: calc(100% - 280px);
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--prts-hairline-strong); background: color-mix(in srgb, var(--prts-panel) 78%, transparent);
  overflow: hidden;
}
.trajRight > .mTabs { flex: none; padding: 6px 8px 0; }
.trajDetailBody { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 8px 12px 12px; }
.rawPre { font-family: var(--prts-mono); font-size: 11px; line-height: 1.5; color: var(--prts-ink-dim); white-space: pre-wrap; word-break: break-all; max-height: 380px; overflow-y: auto; }
/* task view */
.trajTaskList { display: flex; flex-direction: column; gap: 6px; }
.trajTask { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--prts-hairline); border-radius: 8px; }
.trajTaskMark { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--prts-ink-faint); }
.trajTask.done .trajTaskMark { background: #9ece6a; }
.trajTask.pending .trajTaskMark { background: var(--prts-ink-faint); }
.trajTask.running { border-color: var(--prts-accent); }
.trajTask.running .trajTaskMark { background: var(--prts-accent); animation: prtsRunningHalo 1.2s ease-in-out infinite; }
.trajTaskTimer { font-family: var(--prts-mono); font-size: 11px; color: var(--prts-accent); }
/* status glow (PRTS代理) */
.statusRow .shimmer { color: var(--prts-accent); text-shadow: 0 0 14px color-mix(in srgb, var(--prts-accent) 60%, transparent); }

/* ---------- 0.8.2: WEB panel (iframe dsh-web) ---------- */
.webCard {
  width: min(1120px, calc(100vw - 40px));
  height: min(760px, calc(100vh - 60px));
  display: flex; flex-direction: column; overflow: hidden;
  padding: 16px 18px 0;
  background: color-mix(in srgb, var(--prts-panel) 88%, transparent);
}
.webCard .settingsHead { flex: none; margin-bottom: 10px; }
#webFrame {
  flex: 1; width: 100%; border: none; border-radius: 10px;
  background: #0A0A0B;
}

/* ---------- unified settings + bottom-left section popup ---------- */
.prtsSettingsPort { padding: 0 2px 18px; }
.prtsSettingsPort > .prtsPorts > .prtsPort { width: 100%; }
.prtsSecPop {
  position: fixed; z-index: 120; display: flex; flex-direction: column;
  min-width: 128px; max-width: 260px; max-height: min(420px, 60vh); overflow-y: auto;
  padding: 4px; gap: 1px;
  background: color-mix(in srgb, var(--prts-panel) 92%, transparent);
  backdrop-filter: blur(var(--prts-glass, 12px));
  border: 1px solid var(--prts-hairline-strong); border-radius: 8px;
  box-shadow: 0 12px 32px color-mix(in srgb, #000 45%, transparent);
  opacity: 0; transform: translateY(6px) scale(0.98);
  transition: opacity 0.16s var(--prts-ease), transform 0.16s var(--prts-ease);
  pointer-events: none;
}
.prtsSecPop.open { opacity: 1; transform: none; pointer-events: auto; }
.prtsSecPopItem {
  display: block; width: 100%; text-align: left;
  padding: 6px 10px; border: none; border-radius: 5px;
  background: transparent; color: var(--prts-ink-dim);
  font-size: 12px; line-height: 18px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.prtsSecPopItem:hover { background: var(--prts-surface-2); color: var(--prts-ink); }

/* ---------- audio beat on the brand mark (system-sound mode) ---------- */
.brand.beat .rhombus { transform: scale(calc(1 + var(--prts-beat, 0) * 0.22)); }
.brand.beat .brandFx { opacity: calc(0.35 + var(--prts-beat, 0) * 0.65); }

/* PRTS design tokens — pure black/white. Dark is the default surface; light
   inverts the pair. Every component derives from these tokens only. */
:root {
  --prts-bg: #0A0A0B;
  --prts-surface: #111112;
  --prts-surface-2: #161618;
  --prts-ink: #FAFAFA;
  --prts-ink-dim: #9C9CA1;
  --prts-ink-faint: #626266;
  --prts-hairline: rgba(250, 250, 250, 0.14);
  --prts-hairline-strong: rgba(250, 250, 250, 0.3);
  --prts-panel: #0D0D0E;
  --prts-invert-bg: #FAFAFA;
  --prts-invert-ink: #0A0A0B;
  --prts-scrim: rgba(0, 0, 0, 0.6);
  --prts-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(250, 250, 250, 0.04);
  --prts-ease: cubic-bezier(0.4, 0, 0.2, 1);
  --prts-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  /* PRTS accent marks: overridden inline by the custom theme (custom colors);
     default = ink so black/white themes stay monochrome. */
  --prts-accent: var(--prts-ink);
  --prts-diamond: var(--prts-ink);
  --prts-square: var(--prts-ink);
  /* liquid-glass blur radii; the settings toggle zeroes them */
  --prts-glass: 12px;
  --prts-glass-strong: 20px;
  --prts-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --prts-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, Menlo,
    'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
  color-scheme: dark;
}
[data-theme='light'] {
  --prts-bg: #FAFAFA;
  --prts-surface: #F3F3F3;
  --prts-surface-2: #EBEBEB;
  --prts-ink: #0A0A0B;
  --prts-ink-dim: #5C5C60;
  --prts-ink-faint: #A6A6AA;
  --prts-hairline: rgba(10, 10, 11, 0.14);
  --prts-hairline-strong: rgba(10, 10, 11, 0.3);
  --prts-panel: #FFFFFF;
  --prts-invert-bg: #0A0A0B;
  --prts-invert-ink: #FAFAFA;
  --prts-scrim: rgba(250, 250, 250, 0.6);
  --prts-shadow: 0 12px 32px rgba(10, 10, 11, 0.12), 0 0 0 1px rgba(10, 10, 11, 0.04);
  color-scheme: light;
}

body[data-glass='off'] { --prts-glass: 0px; --prts-glass-strong: 0px; }

</style>
</head>
<body>
<div id="wallpaperLayer" aria-hidden="true"></div>
<div id="app" class="frame" data-details-collapsed>
  <!-- The single sidebar toggle: top-left, always visible. It collapses and
       re-expands the sidebar and never moves or hides. -->
  <button class="sbToggleBtn" id="sbToggleBtn" type="button" data-i18n-title="sidebar.collapse" aria-expanded="true" aria-label="Collapse sidebar">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7.8 3.2 4.6 7l3.2 3.8M9.6 3.2 6.4 7l3.2 3.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <aside class="sbCol" id="sbCol">
    <div class="sb bracket">
      <div class="logoRow">
        <button class="brand" id="brandBtn" type="button" title="PRTS">
          <span class="rhombus"></span>
          <span class="word">PRTS</span>
          <canvas class="brandFx" id="brandFx" width="48" height="16"></canvas>
        </button>
        <div class="sbActions">
          <button class="iconBtn themeBtn" id="themeBtn" type="button" data-i18n-title="common.theme" aria-label="Toggle theme">
            <span class="themeIcons">
              <svg class="themeSun" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <circle cx="7.5" cy="7.5" r="3" stroke="currentColor" stroke-width="1.2"/>
                <path d="M7.5 1.2v1.4M7.5 12.4v1.4M1.2 7.5h1.4M12.4 7.5h1.4M3 3l1 1M11 11l1 1M12 3l-1 1M4 11l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <svg class="themeMoon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path d="M12.6 9.6A5.4 5.4 0 0 1 5.4 2.4 5.6 5.6 0 1 0 12.6 9.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
              <svg class="themeDiamond" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="themeDiamondGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7dcfff"/><stop offset="0.5" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/>
                  </linearGradient>
                </defs>
                <path d="M7.5 1.8 13.2 7.5 7.5 13.2 1.8 7.5Z" stroke="url(#themeDiamondGrad)" stroke-width="1.2"/>
                <path d="M5.6 5.6h3.8v3.8H5.6Z" fill="url(#themeDiamondGrad)"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <div class="newButtons">
        <button class="sbBtn" id="newProjectBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="sidebar.newWorkspace">New workspace</span>
        </button>
        <button class="sbBtn" id="newSessionBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2" transform="rotate(45 6.5 6.5)"/></svg>
          <span data-i18n="sidebar.newSession">New session</span>
        </button>
      </div>
      <div class="sbSection sbSectionWorkspaces">
        <div class="sbSectionInner">
          <div class="sbSectionHead">
            <button class="headBtn sbViewIcon" id="viewToggleBtn" type="button" data-i18n-title="sidebar.viewToggle" title="Switch view">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.2 2H2.1a.8.8 0 0 0-.8.8v6.4a.8.8 0 0 0 .8.8h7.8a.8.8 0 0 0 .8-.8V4.3a.8.8 0 0 0-.8-.8H6L5.2 2Z" fill="currentColor"/></svg>
            </button>
            <span class="eyebrow" data-i18n="sidebar.workspaces">Workspaces</span>
            <span class="count" id="projectCount"></span>
          </div>
          <button class="sbWsBtn" id="sidebarWsBtn" type="button" data-i18n-title="workspace.switch">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.3 2H2.2a.9.9 0 0 0-.9.9v6.2a.9.9 0 0 0 .9.9h7.6a.9.9 0 0 0 .9-.9V4.4a.9.9 0 0 0-.9-.9H6L5.3 2Z" fill="currentColor"/></svg>
            <span class="name" id="sidebarWsLabel">dsh</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
          </button>
          <div class="sbList" id="projectList"></div>
        </div>
      </div>
      <div class="sbSection sbSectionSessions">
        <div class="sbSectionInner">
          <div class="sbSectionHead">
          <span class="eyebrow" data-i18n="sidebar.sessions">Sessions</span>
          <button class="headBtn" id="sessionSelectBtn" type="button" data-i18n-title="session.selectMode" aria-pressed="false">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="2" stroke="currentColor" stroke-width="1.1"/><path d="M3.6 6.2 5.2 7.8 8.4 4.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="count" id="sessionCount"></span>
        </div>
        <div class="sbSearch">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5.2" cy="5.2" r="3.6" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.8 2.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <input id="sessionSearch" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="sidebar.searchSessions">
          <button class="sbSearchClear" id="sessionSearchClear" type="button" title="Clear">×</button>
        </div>
        <div class="sbList" id="sessionList" style="overflow-y:auto;"></div>
        <div class="bulkBar" id="sessionBulkBar" hidden>
          <button class="bulkBtn" id="sessionBulkAll" type="button" data-i18n="session.selectAll">Select all</button>
          <span class="bulkLabel" id="sessionBulkLabel"></span>
          <span class="spacer"></span>
          <button class="bulkBtn" id="sessionBulkCancel" type="button" data-i18n="common.cancel">Cancel</button>
          <button class="bulkBtn danger" id="sessionBulkArchive" type="button" data-i18n="session.archiveSelected" disabled>Archive</button>
        </div>
        </div>
      </div>
      <div class="sbFoot">
        <button class="sbFootItem" id="settingsBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 9.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" stroke="currentColor" stroke-width="1.15"/><path d="M13.2 7v.9l-1.7.3a4 4 0 0 1-.5 1.2l1 1.4-.9.9-1.4-1a4 4 0 0 1-1.2.5L8 12.9h-.9L6.8 11.2a4 4 0 0 1-1.2-.5l-1.4 1-.9-.9 1-1.4a4 4 0 0 1-.5-1.2L2.1 6.9V6l1.7-.3a4 4 0 0 1 .5-1.2l-1-1.4.9-.9 1.4 1a4 4 0 0 1 1.2-.5L7.1 1.1H8l.3 1.7a4 4 0 0 1 1.2.5l1.4-1 .9.9-1 1.4a4 4 0 0 1 .5 1.2l1.7.3Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span data-i18n="sidebar.settings">Settings</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="ctCol">
    <div class="cvt" id="cvt" data-phase="hero">
      <div class="voiceDiamond" id="voiceDiamond" aria-hidden="true"><span class="diamondShape" id="diamondShape"></span><span class="squareShape" id="squareShape"></span></div>
      <header class="cvtHeader" id="header">
        <div class="titleRow">
          <div class="crumbs">
            <button class="crumb" id="crumbProject" type="button" data-i18n-title="workspace.switch">
              <span id="crumbProjectLabel">dsh</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
            </button>
            <button class="chip modeChip static" id="modeChip" type="button">

    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  function tableHtml(rows) {
    const grid = rows.map((r) => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim()));
    let html = '<div class="tblWrap"><table>';
    grid.forEach((cs, ri) => {
      if (ri === 1 && cs.every((c) => /^:?-{2,}:?$/.test(c))) return;
      html += '<tr>' + cs.map((c) => (ri === 0 ? '<th>' : '<td>') + INLINE_MD(c) + (ri === 0 ? '</th>' : '</td>')).join('') + '</tr>';
    });
    html += '</table></div>';
    return html;
  }
  function mdToHtml(text) {
    let s = esc(text);
    // emoji → monochrome glyphs (webUI-style rendered marks, not color emoji)
    s = s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, (m) => '<span class="emoji">' + m + '</span>');
    const codeBlocks = [];
    s = s.replace(/```([\s\S]*?)```/g, (m, code) => { codeBlocks.push(code); return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000'; });
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img class="mdImg" src="$2" alt="$1">');
    s = s.replace(/(^|\n)(https?:\/\/\S+\.(?:png|jpe?g|gif|webp|svg|bmp)(?:\?\S*)?)/gi, '$1<img class="mdImg" src="$2" alt="">');
    // pipe tables first (line-based), everything else inline
    const lines = s.split('\n');
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      if (/^\s*\|.*\|\s*$/.test(lines[i]) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
        out.push(tableHtml(rows));
        i--;
      } else {
        out.push(INLINE_MD(lines[i]));
      }
    }
    s = out.join('<br>');
    s = s.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => '<pre>' + codeBlocks[Number(i)] + '</pre>');
    return s;
  }

  /* ---------- content blocks ---------- */
  function blockKind(block) {
    const ty = block && block.type;
    if (ty === 'thinking' || ty === 'reasoning') return 'reasoning';
    if (ty === 'text') return 'text';
    if (ty === 'image') return 'image';
    return 'other';
  }
  function imageSrcOf(block) {
    if (!block || block.type !== 'image') return null;
    if (block.data && typeof block.data === 'string') {
      return 'data:' + (block.mediaType || 'image/png') + ';base64,' + block.data;
    }
    if (block.attachment && block.attachment.attachmentId) {
      return { attachmentId: block.attachment.attachmentId, mediaType: block.attachment.mediaType || 'image/png' };
    }
    return null;
  }

  /** message -> ordered blocks + aggregated fields (webUI block parity). */
  function messageParts(msg) {
    const out = { blocks: [], reasoning: '', text: '', images: [], usage: null, model: null };
    if (!msg) return out;
    if (typeof msg.reasoning === 'string' && msg.reasoning) {
      out.reasoning = msg.reasoning;
      out.blocks.push({ kind: 'reasoning', text: msg.reasoning });
    }
    const content = Array.isArray(msg.content) ? msg.content : [];
    for (const b of content) {
      const ty = b && b.type;
      if (ty === 'reasoning' || ty === 'thinking') {
        const t = (b.text || b.content || '');
        if (t) { out.reasoning += t; out.blocks.push({ kind: 'reasoning', text: t }); }
      } else if (ty === 'text') {
        const t = b.text || '';
        if (t) { out.text += t; out.blocks.push({ kind: 'text', text: t }); }
      } else if (ty === 'image') {
        const s2 = imageSrcOf(b);
        if (s2) { out.images.push(s2); out.blocks.push({ kind: 'image', src: s2 }); }
      } else if (ty === 'tool-call' || ty === 'tool_use') {
        out.blocks.push({ kind: 'toolcall', callId: b.id || b.callId || null, name: b.name || 'tool', arguments: b.arguments || b.input || '' });
      }
    }
    out.usage = msg.usage || null;
    out.model = msg.model || null;
    return out;
  }

  /* ---------- live streaming fold state ---------- */
  const live = {
    seq: -1,
    id: null,
    reasoning: '',
    text: '',
    usage: null,
    model: null,
    toolCalls: [],   // [{ callId, name, args }]
    blocks: [],      // ordered streamed blocks (toolcall entries)
    turn: null,
    step: null,
    finished: false,
    msgRef: null,    // the assistant message object owned by C.messages
  };

  function resetLive() {
    live.seq = -1; live.id = null; live.reasoning = ''; live.text = '';
    live.usage = null; live.model = null; live.toolCalls = []; live.blocks = [];
    live.turn = null; live.step = null; live.finished = false;
    live.msgRef = null;
  }

  // Streaming bursts (assistant/chunk) arrive faster than frames — schedule
  // one render per animation frame, never more often than every 90 ms, so a
  // heavy turn re-renders the flow a handful of times instead of once per chunk.
  let renderScheduled = false;
  let lastRenderAt = 0;
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => {
      renderScheduled = false;
      const now = performance.now();
      if (now - lastRenderAt < 90) {
        setTimeout(scheduleRender, 90 - (now - lastRenderAt));
        return;
      }
      lastRenderAt = now;
      renderFlow();
    });
  }

  function upsertLive(msg) {
    // The live message is kept by reference — no per-chunk array scan.
    if (live.msgRef && C.messages.indexOf(live.msgRef) >= 0) {
      live.msgRef.content = msg.content;
      live.msgRef.reasoning = msg.reasoning;
      live.msgRef.usage = msg.usage || live.msgRef.usage;
      live.msgRef.model = msg.model || live.msgRef.model;
      live.msgRef.streaming = !live.finished;
      return;
    }
    C.messages.push(msg);
    live.msgRef = msg;
  }

  function snapshotLive() {
    const msg = {
      id: live.id || ('a' + live.seq),
      _seq: live.seq,
      _live: true,
      role: 'assistant',
      content: live.text,
      reasoning: live.reasoning,
      usage: live.usage,
      model: live.model,
      ts: Date.now(),
      streaming: !live.finished,
    };
    upsertLive(msg);
    return msg;
  }

  function foldChunk(ev) {
    const d = ev.data || {};
    const chunk = d.chunk || {};
    if (live.seq < 0) {
      live.seq = ev.seq;
      live.turn = d.turn;
      live.step = d.step;
      // carry the message id when the wire provides one (text/reasoning
      // chunks share the assistant message's id on current dsh builds)
      live.id = d.messageId || d.message || chunk.messageId || null;
    }
    switch (chunk.type) {
      case 'reasoning-delta':
        live.reasoning += chunk.text || '';
        break;
      case 'text-delta':
        live.text += chunk.text || '';
        break;
      case 'tool-call-delta': {
        // Aggregated per callId: { callId, name, args }
        const callId = chunk.id || chunk.callId || (chunk.toolCall && chunk.toolCall.id);
        let tc = live.toolCalls.find((x) => x.callId === callId);
        if (!tc) {
          tc = { callId, name: chunk.name || (chunk.toolCall && chunk.toolCall.name) || '', args: '' };
          live.toolCalls.push(tc);
          live.blocks.push({ kind: 'toolcall', callId, name: tc.name, arguments: '', result: null });
        }
        const blk = live.blocks.find((b) => b.kind === 'toolcall' && b.callId === callId);
        if (blk) blk.arguments = tc.args;
        if (!tc.name && (chunk.name || (chunk.toolCall && chunk.toolCall.name))) tc.name = chunk.name || chunk.toolCall.name;
        if (chunk.arguments || chunk.argumentsDelta || (chunk.toolCall && chunk.toolCall.arguments)) {
          tc.args += chunk.arguments || chunk.argumentsDelta || (chunk.toolCall && chunk.toolCall.arguments) || '';
        }
        break;
      }
      case 'usage':
        live.usage = chunk.usage || chunk;
        break;
      case 'finish':
        live.finished = true;
        break;
      default:
        break; // block-start / block-end / unknown
    }
    // The final assistant/message owns durable truth; the live message just
    // mirrors the stream until then.
    snapshotLive();
  }

  function finishStreaming() {
    if (!C.streaming) return;
    C.streaming = false;
    swapSendStop(false);
    if (C.workTimer) { clearInterval(C.workTimer); C.workTimer = null; }
    if (C.onStreaming) { try { C.onStreaming(false); } catch (e) { /* noop */ } }
  }

  /* ---------- event fold ---------- */
  function foldEvent(ev) {
    if (!ev || typeof ev !== 'object') return;
    const type = ev.type;
    const data = (ev && ev.data) || {};
    C.rawEvents.push(ev);
    if (C.rawEvents.length > 800) C.rawEvents.splice(0, C.rawEvents.length - 800);

    if (type === 'user/message') {
      const msg = data.message || data;
      const parts = messageParts(msg);
      const existing = C.messages.find((m) => m._seq === ev.seq || (msg.id && m.id === msg.id));
      if (existing) return;
      C.messages.push({
        id: (msg && msg.id) || ('u' + ev.seq), _seq: ev.seq, role: 'user',
        content: parts.text, images: parts.images, ts: ev.time,
      });
    } else if (type === 'assistant/message') {
      const msg = data.message || data;
      const parts = messageParts(msg);
      const id = msg && msg.id;
      const existing = C.messages.find((m) => m._seq === ev.seq || (id && m.id === id));
      const liveMsg = live.msgRef;
      if (liveMsg) {
        // drop the streamed copy unless it IS the deduped target — this is
        // the "agent replies twice" bug: live + final used to coexist.
        const idx = C.messages.indexOf(liveMsg);
        if (idx >= 0 && existing !== liveMsg) C.messages.splice(idx, 1);
        live.msgRef = null;
      }
      resetLive();
      if (existing) {
        existing.content = parts.text;
        if (parts.reasoning) existing.reasoning = parts.reasoning;
        existing.images = parts.images;
        existing.blocks = parts.blocks;
        existing.usage = parts.usage || existing.usage;
        existing.model = parts.model || existing.model;
        existing.streaming = false;
        existing._live = false;
      } else {
        const prevUser = [...C.messages].reverse().find((m) => m.role === 'user');
        const durMs = prevUser && ev.time ? Math.max(0, ev.time - prevUser.ts) : null;
        C.messages.push({
          id: id || ('a' + ev.seq), _seq: ev.seq, role: 'assistant',
          content: parts.text, reasoning: parts.reasoning, images: parts.images,
          blocks: parts.blocks,
          ts: ev.time, usage: parts.usage, model: parts.model, streaming: false,
          durMs,
        });
      }
      if (P.cost && parts.usage) {
        P.cost.addUsage({ id: id || ('a' + ev.seq), _seq: ev.seq, usage: parts.usage, model: parts.model });
      }
      finishStreaming();
    } else if (type === 'assistant/chunk') {
      foldChunk(ev);
    } else if (type === 'tool/call') {
      const existing = C.messages.find((m) => m._seq === ev.seq);
      if (existing) return;
      C.messages.push({
        id: 't' + ev.seq, _seq: ev.seq, role: 'tool',
        content: '', name: data.name || data.tool || 'tool',
        callId: data.callId || null, args: data.arguments || '', ts: ev.time,
      });
    } else if (type === 'tool/result') {
      // Attach the result to its tool call (callId travels in source.callId).
      const msg = data.message || data;
      const src = msg && msg.source ? msg.source : null;
      const callId = (src && src.callId) || data.callId || null;
      let text = '';
      if (Array.isArray(msg && msg.content)) {
        text = msg.content.map((b) => {
          if (Array.isArray(b.content)) return b.content.map((bb) => bb.text || '').join('');
          return b.text || '';
        }).join('\n');
      } else {
        text = data.text || data.output || '';
      }
      let target = null;
      let targetBlock = null;
      if (callId) {
        // 1) streamed live blocks
        const lb = live.blocks.find((b) => b.kind === 'toolcall' && b.callId === callId);
        if (lb) { lb.result = text; targetBlock = lb; target = live.msgRef || null; }
        // 2) blocks inside final assistant messages
        if (!targetBlock) {
          for (let i = C.messages.length - 1; i >= 0; i--) {
            const m = C.messages[i];
            if (m.role !== 'assistant' || !Array.isArray(m.blocks)) continue;
            const blk = m.blocks.find((b) => b.kind === 'toolcall' && b.callId === callId);
            if (blk) { blk.result = text; targetBlock = blk; target = m; break; }
          }
        }
        // 3) standalone tool messages (fallback)
        if (!targetBlock) target = C.messages.filter((m) => m.role === 'tool').reverse().find((m) => m.callId === callId);
      }
      if (target && !targetBlock) {
        target.content = text;
        target.resultSeq = ev.seq;
      } else if (!targetBlock) {
        C.messages.push({ id: 'r' + ev.seq, _seq: ev.seq, role: 'tool', content: text, name: data.name || 'tool', callId, ts: ev.time });
      }
      scheduleRender();
    } else if (type === 'step/start') {
      C.activeSteps += 1;
      if (!C.workTimer) {
        C.workStartAt = Date.now();
        C.workTimer = setInterval(() => {
          const s = Math.round((Date.now() - C.workStartAt) / 1000);
          if (C.onStatus) { try { C.onStatus(t('chat.working', { s })); } catch (e) { /* noop */ } }
        }, 1000);
      }
      if (C.onStatus) { try { C.onStatus(t('chat.working', { s: 0 })); } catch (e) { /* noop */ } }
    } else if (type === 'step/end') {
      C.activeSteps = Math.max(0, C.activeSteps - 1);
      if (C.activeSteps <= 0) {
        if (C.workTimer) { clearInterval(C.workTimer); C.workTimer = null; }
        if (C.onStatus) { try { C.onStatus(null); } catch (e) { /* noop */ } }
      }
    } else if (type === 'command/run') {
      C.messages.push({
        id: 'c' + ev.seq, _seq: ev.seq, role: 'system', ts: ev.time,
        content: '/' + (data.name || 'command') + (data.args ? ' ' + data.args : ''),
      });
    } else if (type === 'permission/preset') {
      C.messages.push({ id: 'p' + ev.seq, _seq: ev.seq, role: 'system', ts: ev.time, content: t('chat.permissionSet', { preset: data.preset }) });
    } else if (type === 'sandbox/mode') {
      C.messages.push({ id: 's' + ev.seq, _seq: ev.seq, role: 'system', ts: ev.time, content: t('chat.sandboxMode', { mode: data.mode }) });
    } else if (type === 'approval/policy') {
      C.messages.push({ id: 'ap' + ev.seq, _seq: ev.seq, role: 'system', ts: ev.time, content: t('chat.approvalPolicy', { policy: data.policy }) });
    }
    // Any event that changed the message list repaints the flow — webUI
    // parity: your own sends show up instantly, results attach in place.
    if (type === 'user/message' || type === 'assistant/message' || type === 'tool/call' || type === 'tool/result' || type === 'command/run' || type === 'permission/preset' || type === 'sandbox/mode' || type === 'approval/policy') {
      scheduleRender();
    }
  }

  /* ---------- rendering ---------- */
  function renderUser(msg) {
    const wrap = el('div', 'userRow');
    const bubble = el('div', 'userBubble');
    if (msg.content) bubble.innerHTML = linkifyPaths(mdToHtml(msg.content));
    for (const img of msg.images || []) bubble.appendChild(imageEl(img));
    wrap.appendChild(bubble);
    const foot = el('div', 'msgFoot');
    const tr = el('div', 'maRow');
    tr.appendChild(el('span', 'maTime', clock(msg.ts)));
    foot.appendChild(tr);
    const actions = el('div', 'msgActions');
    const cp = el('button', 'maBtn');
    cp.type = 'button';
    cp.title = t('chat.copy');
    cp.innerHTML = P.icons['ma.copy'] || '';
    cp.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = navigator.clipboard ? navigator.clipboard.writeText(msg.content || '') : Promise.reject(new Error('no clipboard'));
      p.then(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copied')); })
        .catch(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copyFail')); });
    });
    actions.appendChild(cp);
    foot.appendChild(actions);
    wrap.appendChild(foot);
    return wrap;
  }

  function imageEl(src) {
    const img = document.createElement('img');
    img.className = 'mdImg';
    img.alt = '';
    if (typeof src === 'string') {
      img.src = src;
    } else if (src && src.attachmentId && P.dshState && P.dshState.attachment && C.sessionId) {
      img.dataset.attachmentId = src.attachmentId;
      img.src = '';
      P.dshState.attachment(C.sessionId, src.attachmentId)
        .then((url) => { if (img.isConnected) img.src = url; })
        .catch(() => { /* attachment unreadable */ });
    }
    return img;
  }

  /* ---------- message actions (dsh-web parity, PRTS marks) ---------- */

  const TL_COLORS = {
    'user/message': '#9C9CA1',
    'assistant/message': '#9ece6a',
    'assistant/chunk': '#7aa2f7',
    'tool/call': '#e0af68',
    'tool/result': '#e0af68',
    'command/run': '#bb9af7',
    'permission/preset': '#bb9af7',
    'sandbox/mode': '#bb9af7',
    'approval/policy': '#bb9af7',
    'step/start': '#626266',
    'step/end': '#626266',
  };
  function chunkColor(ev) {
    const t = ev && ev.data && ev.data.chunk && ev.data.chunk.type;
    if (t === 'reasoning-delta') return '#9d7cd8'; // think
    if (t === 'text-delta') return '#9ece6a';      // output
    if (t === 'usage') return '#7aa2f7';           // tokens
    if (t === 'tool-call-delta') return '#e0af68'; // tool
    return TL_COLORS['assistant/chunk'] || '#7aa2f7';
  }
  function colorOf(ev) {
    if (ev.type === 'assistant/chunk') return chunkColor(ev);
    return TL_COLORS[ev.type] || '#7aa2f7';
  }
  function roleNameOf(ev) {
    switch (ev.type) {
      case 'user/message': return t('traj.user');
      case 'assistant/message': return t('traj.output');
      case 'assistant/chunk': {
        const c = ev.data && ev.data.chunk && ev.data.chunk.type;
        if (c === 'reasoning-delta') return t('traj.think');
        if (c === 'tool-call-delta') return t('traj.tool');
        if (c === 'usage') return t('traj.usage');
        return t('traj.stream');
      }
      case 'tool/call': return t('traj.toolCall');
      case 'tool/result': return t('traj.toolResult');
      case 'command/run': return t('traj.command');
      case 'step/start': return t('traj.stepStart');
      case 'step/end': return t('traj.stepEnd');
      default: return String(ev.type);
    }
  }

  /** Open a path in the file manager/system editor (dsh-web underline parity). */
  function openFilePath(path) {
    if (P.app && P.app.openFile) P.app.openFile(path).catch(() => {});
  }
  const PATH_RE = /(?:[\s("'])(\/(?:home|workspace|workspaces|tmp|var|usr|etc|opt|srv|root|mnt|media|run|data)\/[^\s<>"']+)/g;
  function extractPaths(text) {
    const out = [];
    const re = new RegExp(PATH_RE.source, 'g');
    let m;
    while ((m = re.exec(String(text || ''))) !== null) {
      const clean = m[1].replace(/[),.;，。；：]+$/, '');
      if (out.indexOf(clean) < 0) out.push(clean);
    }
    return out.slice(0, 12);
  }
  /** Deliverable chips: every file the answer produced, clickable. */
  function deliverablesEl(text) {
    const paths = extractPaths(text);
    if (!paths.length) return null;
    const box = el('div', 'dlvChips');
    for (const p of paths) {
      const chip = el('button', 'dlvChip');
      chip.type = 'button';
      chip.title = p;
      chip.innerHTML = P.icons['ma.read'] + '<span>' + esc(p.split('/').pop() || p) + '</span>';
      chip.addEventListener('click', (e) => { e.stopPropagation(); openFilePath(p); });
      box.appendChild(chip);
    }
    return box;
  }
  /** Absolute paths get an underline link (click opens the file). */
  function linkifyPaths(html) {
    return String(html || '').replace(PATH_RE, (m, pre, path) => {
      const clean = path.replace(/[),.;，。；：]+$/, '');
      return pre + '<a class="pathLink" data-path="' + esc(clean) + '">' + esc(clean) + '</a>';
    });
  }

  async function sendFeedback(msg, value) {
    try {
      if (value) await P.dsh.request('messageFeedback.put', { messageId: msg.id, value });
      else await P.dsh.request('messageFeedback.delete', { messageId: msg.id });
      C.msgFeedback = C.msgFeedback || {};
      if (value) C.msgFeedback[msg.id] = value;
      else delete C.msgFeedback[msg.id];
      renderFlow();
      if (P.app && P.app.toast) P.app.toast(t('chat.feedbackSent'));
    } catch (e) {
      if (P.app && P.app.toast) P.app.toast(t('chat.feedbackFail'));
    }
  }

  async function branchFrom(msg) {
    try {
      let r = null;
      try { r = await P.dsh.request('session.fork', { sessionId: C.sessionId, boundary: msg._seq }); } catch (e1) { r = null; }
      if (!r || !r.sessionId) r = await P.dsh.request('session.fork', { sourceSessionId: C.sessionId, boundary: msg._seq });
      const child = r && r.sessionId;
      if (!child) throw new Error('no child session');
      P.dshState.currentSessionId = child;
      await P.dshState.listSessions();
      if (P.app && P.app.renderSessions) P.app.renderSessions();
      if (P.app && P.app.selectSession) await P.app.selectSession(child);
      else await C.loadHistory(child);
      if (P.app && P.app.toast) P.app.toast(t('chat.branched'));
    } catch (e) {
      if (P.app && P.app.toast) P.app.toast(t('chat.branchFail', { msg: (e && e.message) || e }));
    }
  }

  function toolIcon(name) {
    const map = {
      bash: 'ma.bash', terminal: 'ma.bash', read: 'ma.read', read_file: 'ma.read',
      edit: 'ma.edit', str_replace_editor: 'ma.edit', str_replace: 'ma.edit', write: 'ma.edit',
      web_fetch: 'search', web_search: 'search', grep: 'search', glob: 'search',
    };
    return P.icons[map[name]] || P.icons['ma.tool'] || '⟳';
  }

  /** Collapsible block row (dsh-web ToolRow): compact header with glyph +
   *  title + summary, click expands the body downward. */
  function blkRow(kind, title, summary, bodyHtml, rawText, status) {
    const item = el('div', 'toolBlock blkRow' + (status && status.failed ? ' failed' : ''));
    const head = el('div', 'dRow blkHead');
    const fold = el('button', 'blkFold');
    fold.type = 'button';
    fold.setAttribute('aria-expanded', 'false');
    fold.setAttribute('aria-label', t('chat.fold'));
    fold.innerHTML = P.icons.chev || '›';
    const glyph = el('span', 'blkGlyph');
    glyph.innerHTML = toolIcon(kind) || P.icons['ma.tool'] || '⟳';
    const copyBtn = el('button', 'blkCopy');
    copyBtn.type = 'button';
    copyBtn.title = t('chat.copy');
    copyBtn.innerHTML = P.icons['ma.copy'] || '';
    copyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const p = navigator.clipboard ? navigator.clipboard.writeText(rawText || '') : Promise.reject(new Error('no clipboard'));
      p.then(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copied')); })
        .catch(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copyFail')); });
    });
    head.appendChild(fold);
    head.appendChild(glyph);
    head.appendChild(el('span', 'dTitle', title));
    if (summary) {
      const s = el('span', 'blkSummary');
      s.textContent = summary;
      s.title = summary;
      head.appendChild(s);
    }
    if (status && status.failed) {
      const st = el('span', 'blkStatus');
      st.textContent = status.text || 'error';
      head.appendChild(st);
    }
    head.appendChild(copyBtn);
    item.appendChild(head);
    const body = el('div', 'dBody');
    if (bodyHtml) body.appendChild(bodyHtml);
    item.appendChild(body);
    fold.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = item.classList.contains('open');
      item.classList.toggle('open', !open);
      fold.setAttribute('aria-expanded', String(!open));
    });
    return item;
  }

  function toolSummary(name, args) {
    const a = String(args || '').trim();
    if (name === 'read' || name === 'read_file') {
      let p = '';
      try { p = (JSON.parse(a).file_path || JSON.parse(a).path) || ''; } catch (e) { p = ''; }
      return p ? '读取 ' + p : '读取文件';
    }
    if (name === 'bash' || name === 'terminal') {
      const line = a.replace(/\n/g, ' ').slice(0, 100);
      return line || '执行命令';
    }
    if (name === 'edit' || name === 'str_replace_editor' || name === 'str_replace' || name === 'write') {
      let p = '';
      try { p = (JSON.parse(a).file_path || JSON.parse(a).path) || ''; } catch (e) { p = ''; }
      return p ? '编辑 ' + p : '编辑文件';
    }
    return a.slice(0, 100) || String(name);
  }

  /** One tool-call block: Bash/Read/Edit card — collapsed by default. */
  function renderToolBlock(blk) {
    const name = String(blk.name || 'tool');
    const argsText = String(blk.arguments || '').slice(0, 1200);
    const body = el('div');
    if (blk.arguments) {
      const argsBody = el('div');
      const pre = el('div', 'thinkBody');
      pre.textContent = argsText;
      const paths = extractPaths(String(blk.arguments));
      const pathRow = el('div', 'dlvChips');
      for (const p of paths.slice(0, 6)) {
        const chip = el('button', 'dlvChip');
        chip.type = 'button';
        chip.innerHTML = P.icons['ma.read'] + '<span>' + esc(p.split('/').pop() || p) + '</span>';
        chip.addEventListener('click', (e) => { e.stopPropagation(); openFilePath(p); });
        pathRow.appendChild(chip);
      }
      if (pathRow.childNodes.length) body.appendChild(pathRow);
      body.appendChild(argsBody.appendChild(pre));
    }
    let failed = false;
    let statusText = '';
    if (blk.result) {
      const d = el('div');
      const pre = el('div', 'thinkBody');
      const err = /(^|\n)(error|failed|stderr|not allowed|denied)/i.test(String(blk.result).slice(0, 400));
      if (err) pre.classList.add('errText');
      pre.innerHTML = linkifyPaths(mdToHtml(String(blk.result).slice(0, 20000)));
      d.appendChild(pre);
      body.appendChild(d);
      if (err) {
        failed = true;
        statusText = String(blk.result).split('\n')[0].slice(0, 40) || 'error';
      }
    }
    return blkRow(name, TOOL_TITLES[name] || name, toolSummary(name, blk.arguments), body, [argsText, blk.result || ''].filter(Boolean).join('\n'), { failed, text: statusText });
  }

  /** Think block row — collapsed, summary line shows the gist. */
  function renderThinkBlock(text) {
    const pre = el('div', 'thinkBody');
    pre.textContent = String(text || '');
    return blkRow('ma.think', t('chat.thinking'), String(text || '').replace(/\n/g, ' ').slice(0, 100), pre, text || '');
  }

  function renderAssistant(msg) {
    const item = el('div', 'assistantItem');
    item.dataset.msg = msg.id;
    // Ordered blocks (webUI parity): think folds, text is the main output,
    // tool-call blocks render Bash/Read/Edit cards with their results.
    const blocks = Array.isArray(msg.blocks) && msg.blocks.length ? msg.blocks : null;
    if (blocks) {
      for (const blk of blocks) {
        if (blk.kind === 'reasoning') {
          item.appendChild(renderThinkBlock(blk.text));
        } else if (blk.kind === 'text') {
          const p = el('p', 'para');
          p.innerHTML = linkifyPaths(mdToHtml(blk.text));
          if (msg.streaming) p.appendChild(el('span', 'caret'));
          item.appendChild(p);
        } else if (blk.kind === 'image') {
          item.appendChild(imageEl(blk.src));
        } else if (blk.kind === 'toolcall') {
          item.appendChild(renderToolBlock(blk));
        }
      }
    } else {
      // legacy fallback (no block info)
      if (msg.reasoning) {
        item.appendChild(renderThinkBlock(msg.reasoning));
      }
      if (msg.content) {
        const p = el('p', 'para');
        p.innerHTML = linkifyPaths(mdToHtml(msg.content));
        if (msg.streaming) p.appendChild(el('span', 'caret'));
        item.appendChild(p);
      }
    }
    for (const img of msg.images || []) item.appendChild(imageEl(img));
    // deliverables: every produced file, clickable, always visible at the end
    const dlv = deliverablesEl(msg.content || '');
    if (dlv) item.appendChild(dlv);
    // meta + persistent actions (bottom-right of the OUTPUT, not on think/tool)
    const foot = el('div', 'msgFoot');
    const meta = el('div', 'msgMeta');
    meta.appendChild(el('span', '', clock(msg.ts)));
    if (msg.durMs) meta.appendChild(el('span', '', ' · ' + fmtDurShort(msg.durMs)));
    if (msg.usage && (msg.usage.prompt_tokens || msg.usage.completion_tokens)) {
      meta.appendChild(el('span', '', ' · ' + t('chat.tokens', { in: msg.usage.prompt_tokens || 0, out: msg.usage.completion_tokens || 0 })));
    }
    foot.appendChild(meta);
    const actions = el('div', 'msgActions');
    const mk = (icon, label, fn) => {
      const b = el('button', 'maBtn');
      b.type = 'button';
      b.title = label;
      b.innerHTML = P.icons[icon] || icon;
      b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
      return b;
    };
    actions.appendChild(mk('ma.copy', t('chat.copy'), () => {
      const txt = [msg.reasoning || '', msg.content || ''].filter(Boolean).join('\n');
      const p = navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject(new Error('no clipboard'));
      p.then(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copied')); })
        .catch(() => { if (P.app && P.app.toast) P.app.toast(t('chat.copyFail')); });
    }));
    const fb = C.msgFeedback || {};
    const up = mk('ma.good', t('chat.good'), () => sendFeedback(msg, fb[msg.id] === 'good' ? null : 'good'));
    if (fb[msg.id] === 'good') up.classList.add('on');
    const dn = mk('ma.bad', t('chat.bad'), () => sendFeedback(msg, fb[msg.id] === 'bad' ? null : 'bad'));
    if (fb[msg.id] === 'bad') dn.classList.add('on');
    actions.appendChild(up); actions.appendChild(dn);
    actions.appendChild(mk('ma.branch', t('chat.branch'), () => branchFrom(msg)));
    foot.appendChild(actions);
    item.appendChild(foot);
    return item;
  }

  function renderTool(msg) {
    const item = el('div', 'assistantItem toolItem');
    item.dataset.msg = msg.id;
    const head = el('div', 'dRow');
    const fold = el('button', 'blkFold');
    fold.type = 'button';
    fold.setAttribute('aria-expanded', 'false');
    fold.setAttribute('aria-label', t('chat.fold'));
    fold.innerHTML = P.icons.chev || '›';
    head.appendChild(fold);
    const glyph = el('span', 'blkGlyph');
    glyph.innerHTML = P.icons['ma.tool'] || '⟳';
    head.appendChild(glyph);
    head.appendChild(el('span', 'dTitle', msg.name));
    item.appendChild(head);
    if (msg.args) {
      const argsBody = el('div', 'dBody');
      const pre = el('div', 'thinkBody');
      pre.textContent = String(msg.args).slice(0, 1200);
      argsBody.appendChild(pre);
      item.appendChild(argsBody);
      fold.addEventListener('click', (e) => {
        e.stopPropagation();
        item.classList.toggle('openArgs');
        fold.setAttribute('aria-expanded', String(item.classList.contains('openArgs')));
      });
      item.classList.add('openArgs');
      fold.setAttribute('aria-expanded', 'true');
    }
    if (msg.content) {
      const d = el('div', 'disclosure open');
      const body = el('div', 'dBody toolBody');
      const pre = el('div', 'thinkBody');
      pre.innerHTML = linkifyPaths(mdToHtml(String(msg.content).slice(0, 20000)));
      body.appendChild(pre);
      d.appendChild(body);
      item.appendChild(d);
      const dlv = deliverablesEl(msg.content);
      if (dlv) item.appendChild(dlv);
    }
    return item;
  }

  function renderSystem(msg) {
    const row = el('div', 'sysLine');
    row.appendChild(el('span', 'sysDot'));
    row.appendChild(el('span', 'sysText', msg.content));
    return row;
  }

  // Each renderFlow call owns a token; waiters resolve per token so a newer
  // render superseding an older one can never strand an await (the 0.6.1
  // "stuck on the particle intro" bug: the single resolver got overwritten).
  C.historyToken = C.historyToken || 0;
  let flowRenderToken = 0;
  const flowWaiters = new Map();   // token -> resolve
  function releaseFlowWaiters() {
    for (const r of flowWaiters.values()) { try { r(); } catch (e) { /* noop */ } }
    flowWaiters.clear();
  }
  function renderFlow() {
    releaseFlowWaiters();           // superseded renders finish immediately
    const flow = $('flow');
    const token = ++flowRenderToken;
    C.flowDone = new Promise((r) => { flowWaiters.set(token, r); });
    const finish = () => {
      scrollBottom();
      const r = flowWaiters.get(token);
      if (r) { flowWaiters.delete(token); r(); }
    };
    if (!flow) { finish(); return; }
    flow.textContent = '';
    if (!C.messages.length) {
      flow.appendChild(el('div', 'emptyChat', C._loading ? t('chat.loading') : t('chat.empty')));
      finish();
      return;
    }
    const CHUNK = 24;   // messages per frame — big histories stop janking switches
    let i = 0;
    const step = () => {
      if (token !== flowRenderToken) {
        // superseded: resolve this token's waiter so nobody waits on it
        const r = flowWaiters.get(token);
        if (r) { flowWaiters.delete(token); r(); }
        return;
      }
      const end = Math.min(i + CHUNK, C.messages.length);
      for (; i < end; i++) {
        const m = C.messages[i];
        if (m.role === 'user') flow.appendChild(renderUser(m));
        else if (m.role === 'assistant') flow.appendChild(renderAssistant(m));
        else if (m.role === 'tool') flow.appendChild(renderTool(m));
        else if (m.role === 'system') flow.appendChild(renderSystem(m));
      }
      if (i < C.messages.length) {
        requestAnimationFrame(step);
      } else {
        finish();
      }
    };
    step();
  }

  function scrollBottom() {
    requestAnimationFrame(() => { const s = $('chatScroll'); if (s) s.scrollTop = s.scrollHeight; });
  }

  /* ---------- trajectory (dsh-web parity: colored blocks, per-node time &
     token cost, search — no black box) ---------- */
  /* ============================================================
     Trajectory (webUI parity): 4-lane waveform, click-to-jump,
     SUMMARY/PREVIEW/RAW details, Duration/Turns/Calls grouping,
     and a live task view while the agent is running.
     ============================================================ */
  let trajQuery = '';
  let trajTime = 'duration';       // duration | clock
  let trajTurnChips = true;        // 轮次 toggle
  let trajCallChips = true;        // 调用数 toggle
  let trajDetailsOpen = true;      // details column
  let trajSelected = null;         // node index
  let trajDetailTab = 'summary';   // summary | preview | raw
  let trajNodesCache = null;
  let trajTickTimer = null;

  // Fixed quartet on every theme (webUI parity): USER blue on top,
  // ASSISTANT purple below, TOOL yellow under it, ERROR red at the bottom.
  const TRAJ_COLORS_DEFAULT = { user: '#7aa2f7', assistant: '#bb9af7', tool: '#e0af68', error: '#f7768e' };
  function trajColor(kind) {
    return TRAJ_COLORS_DEFAULT[kind] || TRAJ_COLORS_DEFAULT.assistant;
  }
  function trajResultText(ev) {
    const d = ev.data || {};
    const msg = d.message || {};
    if (Array.isArray(msg.content)) {
      return msg.content.map((b) => {
        if (Array.isArray(b.content)) return b.content.map((bb) => bb.text || '').join('');
        return b.text || '';
      }).join('\n');
    }
    return d.text || d.output || '';
  }
  function trajKindOf(ev) {
    if (ev.type === 'user/message') return 'user';
    if (ev.type === 'tool/result') {
      return /(^|\n)(error|failed|stderr|not allowed|denied)/i.test(trajResultText(ev).slice(0, 400)) ? 'error' : 'tool';
    }
    if (ev.type === 'tool/call' || (ev.type === 'assistant/chunk' && ev.data && ev.data.chunk && ev.data.chunk.type === 'tool-call-delta')) return 'tool';
    if (/error|failed|turn-error/i.test(ev.type)) return 'error';
    return 'assistant';
  }
  function trajNodes() {
    if (trajNodesCache) return trajNodesCache;
    const nodes = [];
    for (let i = 0; i < C.rawEvents.length; i++) {
      const ev = C.rawEvents[i];
      const d = ev.data || {};
      if (d.turn === undefined && d.step === undefined && ev.type !== 'tool/result' && ev.type !== 'tool/call') continue;
      const next = C.rawEvents[i + 1];
      const dur = next && next.time && ev.time && next.time > ev.time ? next.time - ev.time : null;
      let usage = null;
      if (ev.type === 'assistant/chunk' && d.chunk && d.chunk.type === 'usage') usage = d.chunk.usage || d.chunk;
      nodes.push({ ev, kind: trajKindOf(ev), brief: summaryOf(ev), dur, time: ev.time, turn: d.turn, step: d.step, usage, seq: ev.seq });
    }
    trajNodesCache = nodes;
    return nodes;
  }

  /** Tool row kind → short display title (dsh-web parity). */
  const TOOL_TITLES = {
    bash: 'Bash', terminal: 'Bash', read: 'Read', read_file: 'Read', read_multi: 'Read',
    edit: 'Edit', str_replace_editor: 'Edit', str_replace: 'Edit', write: 'Write',
    web_fetch: 'Web', web_search: 'Search', grep: 'Search', glob: 'Search',
    todo_write: 'Todo', ask_user_question: 'Ask', skill: 'Skill',
  };

  function trajRow(node, idx) {
    const nodes = trajNodes();
    const tr = document.createElement('tr');
    tr.className = 'trajRow' + (trajSelected === idx ? ' sel' : '');
    tr.dataset.kind = node.kind;
    tr.dataset.turnStart = node.turn !== undefined && (idx === 0 || (nodes[idx - 1] && nodes[idx - 1].turn) !== node.turn) ? 'true' : 'false';
    tr.dataset.error = node.kind === 'error' ? 'true' : 'false';
    tr.dataset.selected = trajSelected === idx ? 'true' : 'false';
    tr.dataset.trajIdx = String(idx);
    const tdEv = document.createElement('td');
    tdEv.className = 'trajEvent';
    if (trajTurnChips && node.turn !== undefined && tr.dataset.turnStart === 'true') {
      const chip = document.createElement('span');
      chip.className = 'trajTurnLabel' + (trajSelected === idx ? ' active' : '');
      chip.textContent = 'T' + node.turn;
      tdEv.appendChild(chip);
    }
    const inner = document.createElement('span');
    inner.className = 'trajEventInner';
    const kindSlot = document.createElement('span');
    kindSlot.className = 'trajKindSlot';
    const tag = document.createElement('span');
    const toolName = String(node.brief || '').split(/[\s(]/)[0];
    tag.className = 'trajKindTag trajKind' + (node.kind === 'error' ? 'Error' : node.kind[0].toUpperCase() + node.kind.slice(1));
    tag.textContent = node.kind === 'tool' ? (TOOL_TITLES[toolName] || toolName || t('traj.lane.tool')) : t('traj.lane.' + node.kind);
    kindSlot.appendChild(tag);
    if (trajCallChips && node.kind === 'tool' && node.seq !== undefined) {
      const c = document.createElement('span');
      c.className = 'trajCallChip';
      c.textContent = '#' + node.seq;
      kindSlot.appendChild(c);
    }
    inner.appendChild(kindSlot);
    if (trajTime === 'clock' && node.time) {
      const tm = document.createElement('span');
      tm.className = 'trajTime';
      tm.textContent = clock(node.time);
      inner.appendChild(tm);
    } else if (trajTime === 'duration' && node.dur !== null && node.dur >= 0) {
      const tm = document.createElement('span');
      tm.className = 'trajTime';
      tm.textContent = fmtDurShort(node.dur);
      inner.appendChild(tm);
    }
    tdEv.appendChild(inner);
    tr.appendChild(tdEv);
    const tdC = document.createElement('td');
    tdC.className = 'trajContent';
    const ct = document.createElement('span');
    ct.className = 'trajContentText';
    ct.textContent = String(node.brief || t('traj.na'));
    ct.title = String(node.brief || '');
    tdC.appendChild(ct);
    tr.appendChild(tdC);
    tr.addEventListener('click', () => {
      trajSelected = idx;
      trajDetailTab = 'summary';
      renderTrajectory();
      const again = tr.isConnected;
      if (again) tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    return tr;
  }

  function renderTrajBar(bar) {
    bar.textContent = '';
    const mkToggle = (label, active, onClick) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'trajToggle' + (active ? ' on' : '');
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
      b.textContent = label;
      b.addEventListener('click', () => { onClick(); renderTrajectory(); });
      return b;
    };
    bar.appendChild(mkToggle(t('traj.dur'), trajTime === 'duration', () => { trajTime = 'duration'; }));
    bar.appendChild(mkToggle(t('traj.time.clock'), trajTime === 'clock', () => { trajTime = 'clock'; }));
    bar.appendChild(mkToggle(t('traj.sort.turns'), trajTurnChips, () => { trajTurnChips = !trajTurnChips; }));
    bar.appendChild(mkToggle(t('traj.sort.calls'), trajCallChips, () => { trajCallChips = !trajCallChips; }));
    bar.appendChild(mkToggle(t('traj.details'), trajDetailsOpen, () => { trajDetailsOpen = !trajDetailsOpen; }));
    const search = el('div', 'trajSearch');
    search.innerHTML = (P.icons && P.icons.search) || '';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = t('traj.search');
    input.spellcheck = false;
    input.value = trajQuery;
    input.addEventListener('input', () => { trajQuery = input.value; trajNodesCache = null; renderTrajectory(); });
    search.appendChild(input);
    bar.appendChild(search);
  }

  function renderTrajTable(pane) {
    pane.textContent = '';
    const nodes = trajNodes();
    if (!nodes.length) {
      pane.appendChild(el('div', 'trajEmpty', t('traj.empty')));
      return;
    }
    const table = document.createElement('table');
    table.className = 'trajTable';
    table.innerHTML = '<colgroup><col class="trajEventCol"><col class="trajContentCol"></colgroup>' +
      '<thead><tr><th class="trajEventHeader">' + t('traj.event') + '</th><th>' + t('traj.content') + '</th></tr></thead>';
    const tbody = document.createElement('tbody');
    const q = trajQuery.trim().toLowerCase();
    let shown = 0;
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      if (q && !(String(node.ev.type).toLowerCase().indexOf(q) >= 0 || String(node.brief || '').toLowerCase().indexOf(q) >= 0 || t('traj.lane.' + node.kind).toLowerCase().indexOf(q) >= 0)) continue;
      tbody.appendChild(trajRow(node, i));
      shown++;
    }
    table.appendChild(tbody);
    pane.appendChild(table);
    if (!shown) pane.appendChild(el('div', 'trajEmpty', t('traj.empty')));
  }

  function renderTrajDetail(right) {
    right.textContent = '';
    const nodes = trajNodes();
    const node = nodes[trajSelected];
    if (!node) {
      right.appendChild(el('div', 'trajEmpty', t('traj.pickHint')));
      return;
    }
    const tabs = el('div', 'mTabs');
    [['summary', 'traj.tab.summary'], ['preview', 'traj.tab.preview'], ['raw', 'traj.tab.raw']].forEach(([v, k]) => {
      const b = el('button', 'mTab' + (trajDetailTab === v ? ' on' : ''), t(k));
      b.type = 'button';
      b.addEventListener('click', () => { trajDetailTab = v; renderTrajectory(); });
      tabs.appendChild(b);
    });
    right.appendChild(tabs);
    const body = el('div', 'trajDetailBody');
    const tok = node.usage ? (node.usage.prompt_tokens || 0) + ' in / ' + (node.usage.completion_tokens || 0) + ' out' : t('traj.na');
    if (trajDetailTab === 'summary') {
      const rows = [
        [t('traj.lane.' + node.kind), ''],
        [t('traj.time'), node.time ? clock(node.time) : t('traj.na')],
        [t('traj.dur'), node.dur !== null ? fmtDurShort(node.dur) : t('traj.na')],
        [t('traj.tokens'), tok],
      ];
      for (const [k, v] of rows) {
        const r = el('div', 'dtField');
        r.appendChild(el('div', 'k', k));
        r.appendChild(el('div', 'v', v));
        body.appendChild(r);
      }
      body.appendChild(el('div', 'hint', String(node.brief || '').slice(0, 600)));
    } else if (trajDetailTab === 'preview') {
      const p = el('div', 'thinkBody');
      p.innerHTML = linkifyPaths(mdToHtml(String(node.brief || '').slice(0, 4000)));
      body.appendChild(p);
      // thinking inside preview stays collapsed with its own chevron
      const d = ev2reasoning(node);
      if (d) body.appendChild(renderThinkBlock(d));
    } else {
      const pre = el('pre', 'rawPre');
      pre.textContent = JSON.stringify(node.ev, null, 2).slice(0, 4000);
      body.appendChild(pre);
    }
    right.appendChild(body);
  }

  function ev2reasoning(node) {
    const d = node.ev && node.ev.data;
    const chunk = d && d.chunk;
    if (chunk && chunk.type === 'reasoning-delta') return chunk.text;
    return null;
  }

  /** Live task view while running: completed above, current marked with an
   *  arrow + live elapsed seconds, upcoming below. */
  function renderTaskView(right) {
    right.textContent = '';
    right.appendChild(el('div', 'sSecTitle eyebrow', t('traj.tasks')));
    const cur = [...C.messages].reverse().find((m) => m.role === 'assistant' && m.streaming !== false);
    const blocks = (cur && cur.blocks) || [];
    const done = blocks.filter((b) => b.kind === 'toolcall' && b.result);
    const running = blocks.filter((b) => b.kind === 'toolcall' && !b.result);
    const jobs = (P.dshState && P.dshState.liveJobs && P.dshState.liveJobs[C.sessionId]) || [];
    const jobsDone = jobs.filter((j) => j.status === 'completed');
    const jobsRun = jobs.filter((j) => j.status === 'running' || j.status === 'starting');
    const jobsPending = jobs.filter((j) => j.status !== 'completed' && j.status !== 'running' && j.status !== 'starting');
    const list = el('div', 'trajTaskList');
    const mk = (label, name, cls, extra) => {
      const row = el('div', 'trajTask ' + cls);
      row.appendChild(el('span', 'trajTaskMark'));
      const meta = el('div', 'skItemMeta');
      const nl = el('div', 'skNameLine');
      nl.appendChild(el('span', 'skItemName', name));
      meta.appendChild(nl);
      if (label) meta.appendChild(el('div', 'pmeta', label));
      row.appendChild(meta);
      if (extra) row.appendChild(extra);
