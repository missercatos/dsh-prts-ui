<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRTS</title>
<style>
<!--STYLES-->
</style>
</head>
<body>
<div id="app" class="frame" data-details-collapsed>
  <aside class="sbCol" id="sbCol">
    <div class="sb bracket">
      <div class="logoRow">
        <button class="brand" id="brandBtn" type="button" title="PRTS">
          <span class="rhombus"></span>
          <span class="word">PRTS</span>
          <canvas class="brandFx" id="brandFx" width="48" height="16"></canvas>
        </button>
        <div class="sbActions">
          <button class="iconBtn" id="themeBtn" type="button" title="Toggle theme">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1a6.5 6.5 0 1 0 0 13c.4 0 .7-.4.6-.8a2 2 0 0 1 1.6-2.4c3.2-.4 4.9-2.6 4.9-5.3a6.3 6.3 0 0 0-5-4.3A1 1 0 0 1 7.5 1Z" fill="currentColor"/></svg>
          </button>
          <button class="iconBtn" id="sbCollapseBtn" type="button" title="Collapse sidebar">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M8.5 1.5a1 1 0 0 1 .996 1.093l-.009.09L8.83 7.5l.657 4.817a1 1 0 0 1-1.99.246l-.01-.09-.713-5.225a1.5 1.5 0 0 1 0-.496l.713-5.225A1 1 0 0 1 8.5 1.5Z" fill="currentColor"/><path d="M4 3.5a1 1 0 0 1 .993.883L5 4.5v6a1 1 0 0 1-1.993.117L3 10.5v-6a1 1 0 0 1 1-1Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      <div class="newButtons">
        <button class="sbBtn" id="newProjectBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="sidebar.newWorkspace">New workspace</span>
        </button>
        <button class="sbBtn" id="newSessionBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2" transform="rotate(45 6.5 6.5)"/></svg>
          <span data-i18n="sidebar.newSession">New session</span>
        </button>
      </div>
      <div class="sbSection">
        <div class="sbSectionHead">
          <span class="eyebrow" data-i18n="sidebar.workspaces">Workspaces</span>
          <span class="count" id="projectCount"></span>
        </div>
        <div class="sbList" id="projectList"></div>
      </div>
      <div class="sbSection" style="flex:1;min-height:0;display:flex;flex-direction:column;">
        <div class="sbSectionHead">
          <span class="eyebrow" data-i18n="sidebar.sessions">Sessions</span>
          <span class="count" id="sessionCount"></span>
        </div>
        <div class="sbList" id="sessionList" style="overflow-y:auto;"></div>
      </div>
      <div class="sbFoot">
        <button class="sbFootItem" id="detailsBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="1.5" width="12" height="12" stroke="currentColor" stroke-width="1.1"/><path d="M5 1.5v12M7.5 1.5v12" stroke="currentColor" stroke-width="1.1"/></svg>
          <span data-i18n="sidebar.details">Details</span>
        </button>
        <button class="sbFootItem" id="settingsBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 9.4a1.9 1.9 0 1 0 0-3.8 1.9 1.9 0 0 0 0 3.8Z" stroke="currentColor" stroke-width="1.1"/><path d="M12.8 8.2c.1-.4.1-.7 0-1l1.2-1a.3.3 0 0 0 0-.4l-1.2-2a.3.3 0 0 0-.4-.2l-1.4.6a4.8 4.8 0 0 0-1.8-1L9 1.5a.3.3 0 0 0-.3-.3h-2.4a.3.3 0 0 0-.3.3l-.2 1.7a4.8 4.8 0 0 0-1.8 1l-1.4-.6a.3.3 0 0 0-.4.2l-1.2 2a.3.3 0 0 0 0 .4l1.2 1a3 3 0 0 0 0 1l-1.2 1a.3.3 0 0 0 0 .4l1.2 2a.3.3 0 0 0 .4.2l1.4-.6a4.8 4.8 0 0 0 1.8 1l.2 1.7c0 .2.1.3.3.3h2.4c.2 0 .3-.1.3-.3l.2-1.7a4.8 4.8 0 0 0 1.8-1l1.4.6c.2 0 .4 0 .4-.2l1.2-2a.3.3 0 0 0 0-.4l-1.2-1Z" stroke="currentColor" stroke-width="1.1"/></svg>
          <span data-i18n="sidebar.settings">Settings</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="ctCol">
    <div class="cvt" id="cvt" data-phase="hero">
      <header class="cvtHeader" id="header">
        <div class="titleRow">
          <div class="crumbs">
            <button class="crumb" disabled id="crumbProject">dsh</button>
            <span class="headerMode" data-i18n="header.mode">STANDARD</span>
          </div>
          <div class="headerUtils">
            <span class="pluginBar" id="pluginHeader"></span>
            <button class="iconBtn" id="clearHistoryBtn" type="button" data-i18n-title="header.clearHistory">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5.5 4V2.8h3V4" stroke="currentColor" stroke-width="1.2"/><path d="M4 4l.6 7.2h4.8L10 4" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="logBtn" id="logBtn" type="button">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.2a.8.8 0 0 1 .8.8v3.2h2.4a.8.8 0 0 1 .5 1.4l-3.4 3.4a.8.8 0 0 1-1.1 0L1.8 6.6a.8.8 0 0 1 .5-1.4h2.9V2a.8.8 0 0 1 .8-.8Z" fill="currentColor"/></svg>
              <span data-i18n="header.log">Session log</span>
            </button>
          </div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" type="button" data-view="chat" data-i18n="header.chat">Chat</button>
          <button class="tab" type="button" data-view="trajectory" data-i18n="header.trajectory">Trajectory</button>
        </div>
      </header>
      <div class="scrollBody">
        <div class="heroView" id="heroView">
          <canvas class="heroCanvas" id="heroCanvas"></canvas>
          <div class="heroStack">
            <div class="heroLogo">
              <span class="rhombus-lg"></span>
              <span class="heroWord">PRTS</span>
            </div>
            <div class="heroSub">
              <span class="rule"></span>
              <span class="heroReady" id="heroReady" data-i18n="hero.online">SYSTEM ONLINE</span>
              <span class="rule"></span>
            </div>
            <div class="heroProjectRow">
              <button class="workspaceBtn" id="workspaceBtn" type="button">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.3 2H2.2a.9.9 0 0 0-.9.9v6.2a.9.9 0 0 0 .9.9h7.6a.9.9 0 0 0 .9-.9V4.4a.9.9 0 0 0-.9-.9H6L5.3 2Z" fill="currentColor"/></svg>
                <span id="workspaceLabel">default</span>
              </button>
            </div>
          </div>
        </div>
        <div class="chatScroll" id="chatScroll" hidden>
          <div class="chatColumn" id="flow"></div>
        </div>
        <div class="trajView" id="trajView" hidden></div>
        <div class="composerArea" id="composerArea">
          <div class="statusRow" id="statusRow" hidden>
            <span class="shimmer" id="statusText">DEEP DIVING</span>
          </div>
          <div class="composerExpandRow">
            <button class="expandBtn" id="composerExpand" type="button" data-i18n-title="composer.expand" aria-expanded="false">
              <svg class="expandIcon" width="16" height="22" viewBox="0 0 16 22" fill="none">
                <path d="M8 1 L15 13 L10.6 13 M8 1 L1 13 L5.4 13" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                <circle class="edot" cx="8" cy="16" r="1.15" fill="currentColor"/>
                <circle class="edot" cx="8" cy="19" r="1.15" fill="currentColor"/>
                <circle class="edot" cx="8" cy="22" r="1.15" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="composerCard">
            <textarea class="composerInput" id="composerInput" rows="1" spellcheck="false" data-i18n-placeholder="composer.placeholder"></textarea>
            <div class="composerToolbar">
              <div class="toolGroup">
                <span class="pluginBar" id="pluginComposer"></span>
                <button class="chip" id="modelChip" type="button">
                  <span class="dot"></span>
                  <span class="label" id="modelChipLabel">dsh</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
                <button class="chip" id="commandsChip" type="button">
                  <span data-i18n="composer.commands">Commands</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
              </div>
              <div class="spacer"></div>
              <div class="toolGroup">
                <button class="meterBtn voiceBtn" id="voiceBtn" type="button" title="Voice input" data-i18n-title="voice.off">
                  <svg class="micIcon" width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2a2 2 0 0 0-2 2v3.1a2 2 0 0 0 4 0V3.2a2 2 0 0 0-2-2Z" stroke="currentColor" stroke-width="1.1"/><path d="M2.6 6a3.9 3.9 0 0 0 7.8 0M6.5 9.9v1.9M4.6 11.8h3.8" stroke="currentColor" stroke-width="1.1"/></svg>
                </button>
                <button class="meterBtn" id="meterBtn" type="button">
                  <svg class="ring" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="7" cy="7" r="5.5" stroke="var(--prts-hairline-strong)" stroke-width="1.5" fill="none"/>
                    <circle id="meterRing" cx="7" cy="7" r="5.5" stroke="var(--prts-ink)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="34.56" stroke-dashoffset="34.56" transform="rotate(-90 7 7)"/>
                  </svg>
                  <span id="meterLabel">0%</span>
                </button>
                <button class="sendBtn" id="sendBtn" type="button" title="Send" disabled>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11.2l-3.6-3.6a.8.8 0 1 1 1.1-1.1l4.8 4.8a.8.8 0 0 1 0 1.1l-4.8 4.8a.8.8 0 1 1-1.1-1.1l3.6-3.6H2a.8.8 0 0 1 0-1.5Z" fill="currentColor"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <section class="dtCol" id="dtCol">
    <div class="dtPanel">
      <div class="dtHeader">
        <span class="dtTitle" data-i18n="details.title">Details</span>
        <button class="iconBtn" id="dtClose" type="button" title="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="dtBody" id="dtBody">
        <div class="dtEmpty" data-i18n="details.empty">Click a message to view its metadata.</div>
      </div>
    </div>
  </section>
  <div class="handle" data-side="details" id="handleDetails"></div>
  <div class="handle" data-side="sidebar" id="handleSidebar"></div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="settingsCard">
    <div class="settingsHead">
      <span class="title" data-i18n="settings.title">Settings</span>
      <button class="iconBtn" id="settingsClose" type="button" title="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sField">
      <div class="label"><span data-i18n="settings.language">Language</span></div>
      <select class="sInput sSelect" id="cfgLocale">
        <option value="auto">AUTO</option>
        <option value="zh">中文</option>
        <option value="en">ENGLISH</option>
      </select>
    </div>
    <div class="sField">
      <div class="label"><span data-i18n="settings.providers">Providers &amp; API keys</span></div>
      <div class="hint" data-i18n="settings.providers.hint">API keys are written to the dsh harness home (~/.dsh), managed by dsh — never by this plugin.</div>
      <div id="cfgProviders"></div>
    </div>
    <div class="sRow" style="margin-top: 18px;">
      <button class="sBtn primary" id="cfgSave" type="button" data-i18n="settings.done">Done</button>
      <span class="sStatus" id="cfgStatus"></span>
    </div>
  </div>
</div>

<div class="overlay sysOverlay" id="sysOverlay">
  <div class="sysCard">
    <div class="sysHead">
      <span class="sysTitle"><span class="rhombus-s"></span><span data-i18n="sys.title">SYSTEM</span><span class="sysSlash">//</span>PRTS</span>
      <button class="iconBtn" id="sysClose" type="button" data-i18n-title="sys.close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sysBody">
      <div class="sysVisual">
        <canvas id="sysRing" width="0" height="0"></canvas>
        <div class="sysVisualTag">
          <span class="rhombus-lg"></span>
          <span class="sysVisualWord">PRTS</span>
        </div>
      </div>
      <div class="sysStats">
        <div class="sysBlock">
          <div class="sysBlockTitle eyebrow" data-i18n="sys.hardware">HARDWARE</div>
          <div class="sysRows" id="sysHardware"></div>
        </div>
        <div class="sysDivider"></div>
        <div class="sysBlock">
          <div class="sysBlockTitle eyebrow" data-i18n="sys.agent">AGENT</div>
          <div class="sysRows" id="sysAgent"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <canvas id="introCanvas"></canvas>
  <div class="introTag" id="introTag"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
<!--SCRIPTS-->
</script>
</body>
</html>
