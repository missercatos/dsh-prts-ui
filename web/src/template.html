<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRTS</title>
<style>
<!--STYLES-->
</style>
</head>
<body>
<div id="wallpaperLayer" aria-hidden="true"></div>
<div id="app" class="frame" data-details-collapsed>
  <!-- The single sidebar toggle: top-left, always visible. It collapses and
       re-expands the sidebar and never moves or hides. -->
  <button class="sbToggleBtn" id="sbToggleBtn" type="button" data-i18n-title="sidebar.collapse" aria-expanded="true" aria-label="Collapse sidebar">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7.8 3.2 4.6 7l3.2 3.8M9.6 3.2 6.4 7l3.2 3.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <aside class="sbCol" id="sbCol">
    <div class="sb bracket">
      <div class="logoRow">
        <button class="brand" id="brandBtn" type="button" title="PRTS">
          <span class="rhombus"></span>
          <span class="word">PRTS</span>
          <canvas class="brandFx" id="brandFx" width="48" height="16"></canvas>
        </button>
        <div class="sbActions">
          <button class="iconBtn themeBtn" id="themeBtn" type="button" data-i18n-title="common.theme" aria-label="Toggle theme">
            <span class="themeIcons">
              <svg class="themeSun" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <circle cx="7.5" cy="7.5" r="3" stroke="currentColor" stroke-width="1.2"/>
                <path d="M7.5 1.2v1.4M7.5 12.4v1.4M1.2 7.5h1.4M12.4 7.5h1.4M3 3l1 1M11 11l1 1M12 3l-1 1M4 11l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <svg class="themeMoon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path d="M12.6 9.6A5.4 5.4 0 0 1 5.4 2.4 5.6 5.6 0 1 0 12.6 9.6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              </svg>
              <svg class="themeDiamond" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="themeDiamondGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#7dcfff"/><stop offset="0.5" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/>
                  </linearGradient>
                </defs>
                <path d="M7.5 1.8 13.2 7.5 7.5 13.2 1.8 7.5Z" stroke="url(#themeDiamondGrad)" stroke-width="1.2"/>
                <path d="M5.6 5.6h3.8v3.8H5.6Z" fill="url(#themeDiamondGrad)"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <div class="newButtons">
        <button class="sbBtn" id="newProjectBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="sidebar.newWorkspace">New workspace</span>
        </button>
        <button class="sbBtn" id="newSessionBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2v10.6M1.2 6.5h10.6" stroke="currentColor" stroke-width="1.2" transform="rotate(45 6.5 6.5)"/></svg>
          <span data-i18n="sidebar.newSession">New session</span>
        </button>
      </div>
      <div class="sbSection sbSectionWorkspaces">
        <div class="sbSectionHead">
          <button class="headBtn sbViewIcon" id="viewToggleBtn" type="button" data-i18n-title="sidebar.viewToggle" title="Switch view">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.2 2H2.1a.8.8 0 0 0-.8.8v6.4a.8.8 0 0 0 .8.8h7.8a.8.8 0 0 0 .8-.8V4.3a.8.8 0 0 0-.8-.8H6L5.2 2Z" fill="currentColor"/></svg>
          </button>
          <span class="eyebrow" data-i18n="sidebar.workspaces">Workspaces</span>
          <span class="count" id="projectCount"></span>
        </div>
        <button class="sbWsBtn" id="sidebarWsBtn" type="button" data-i18n-title="workspace.switch">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.3 2H2.2a.9.9 0 0 0-.9.9v6.2a.9.9 0 0 0 .9.9h7.6a.9.9 0 0 0 .9-.9V4.4a.9.9 0 0 0-.9-.9H6L5.3 2Z" fill="currentColor"/></svg>
          <span class="name" id="sidebarWsLabel">dsh</span>
          <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
        </button>
        <div class="sbList" id="projectList"></div>
      </div>
      <div class="sbSection sbSectionSessions" style="flex:1;min-height:0;display:flex;flex-direction:column;">
        <div class="sbSectionHead">
          <span class="eyebrow" data-i18n="sidebar.sessions">Sessions</span>
          <button class="headBtn" id="sessionSelectBtn" type="button" data-i18n-title="session.selectMode" aria-pressed="false">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1.6" y="1.6" width="8.8" height="8.8" rx="2" stroke="currentColor" stroke-width="1.1"/><path d="M3.6 6.2 5.2 7.8 8.4 4.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="count" id="sessionCount"></span>
        </div>
        <div class="sbSearch">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="5.2" cy="5.2" r="3.6" stroke="currentColor" stroke-width="1.1"/><path d="M8 8l2.8 2.8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <input id="sessionSearch" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="sidebar.searchSessions">
          <button class="sbSearchClear" id="sessionSearchClear" type="button" title="Clear">×</button>
        </div>
        <div class="sbList" id="sessionList" style="overflow-y:auto;"></div>
        <div class="bulkBar" id="sessionBulkBar" hidden>
          <button class="bulkBtn" id="sessionBulkAll" type="button" data-i18n="session.selectAll">Select all</button>
          <span class="bulkLabel" id="sessionBulkLabel"></span>
          <span class="spacer"></span>
          <button class="bulkBtn" id="sessionBulkCancel" type="button" data-i18n="common.cancel">Cancel</button>
          <button class="bulkBtn danger" id="sessionBulkArchive" type="button" data-i18n="session.archiveSelected" disabled>Archive</button>
        </div>
      </div>
      <div class="sbFoot">
        <button class="sbFootItem" id="gitBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 14 14" fill="none"><circle cx="3" cy="3.4" r="1.15" stroke="currentColor" stroke-width="1.15"/><circle cx="11" cy="3.4" r="1.15" stroke="currentColor" stroke-width="1.15"/><circle cx="7" cy="10.8" r="1.15" stroke="currentColor" stroke-width="1.15"/><path d="M4 3.9a3 3 0 0 0 2.5 6M10 3.9a3 3 0 0 1-2.5 6" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
          <span data-i18n="sidebar.git">Git</span>
        </button>
        <button class="sbFootItem" id="skillBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 14 14" fill="none"><path d="M7 1.6 12.4 7 7 12.4 1.6 7Z" stroke="currentColor" stroke-width="1.15"/><path d="M4.9 4.9 7 7l2.1-2.1M7 7l2.1 2.1M4.9 9.1 7 7" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/></svg>
          <span data-i18n="sidebar.skills">Skill</span>
        </button>
        <button class="sbFootItem" id="marketBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"><path d="M4.5 2.5 6.5 4.5 4.5 6.5 2.5 4.5Z"/><path d="M11.5 2.5 13.5 4.5 11.5 6.5 9.5 4.5Z"/><path d="M4.5 9.5 6.5 11.5 4.5 13.5 2.5 11.5Z" fill="currentColor" stroke="none"/><path d="M11.5 9.5 13.5 11.5 11.5 13.5 9.5 11.5Z"/></svg>
          <span data-i18n="sidebar.market">Market</span>
        </button>
        <button class="sbFootItem" id="detailsBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="1.5" width="12" height="12" stroke="currentColor" stroke-width="1.1"/><path d="M5 1.5v12M7.5 1.5v12" stroke="currentColor" stroke-width="1.1"/></svg>
          <span data-i18n="sidebar.details">Details</span>
        </button>
        <button class="sbFootItem" id="settingsBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 9.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" stroke="currentColor" stroke-width="1.15"/><path d="M13.2 7v.9l-1.7.3a4 4 0 0 1-.5 1.2l1 1.4-.9.9-1.4-1a4 4 0 0 1-1.2.5L8 12.9h-.9L6.8 11.2a4 4 0 0 1-1.2-.5l-1.4 1-.9-.9 1-1.4a4 4 0 0 1-.5-1.2L2.1 6.9V6l1.7-.3a4 4 0 0 1 .5-1.2l-1-1.4.9-.9 1.4 1a4 4 0 0 1 1.2-.5L7.1 1.1H8l.3 1.7a4 4 0 0 1 1.2.5l1.4-1 .9.9-1 1.4a4 4 0 0 1 .5 1.2l1.7.3Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span data-i18n="sidebar.settings">Settings</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="ctCol">
    <div class="cvt" id="cvt" data-phase="hero">
      <div class="voiceDiamond" id="voiceDiamond" aria-hidden="true"><span class="diamondShape" id="diamondShape"></span><span class="squareShape" id="squareShape"></span></div>
      <header class="cvtHeader" id="header">
        <div class="titleRow">
          <div class="crumbs">
            <button class="crumb" id="crumbProject" type="button" data-i18n-title="workspace.switch">
              <span id="crumbProjectLabel">dsh</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
            </button>
            <button class="chip modeChip static" id="modeChip" type="button">
              <span class="modeChipIcon" id="modeChipIcon"></span>
              <span class="headerMode" id="headerMode" data-i18n="header.mode">STANDARD</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
            </button>
            <button class="chip modeChip permissionChip static" id="permissionChip" type="button" hidden data-i18n-title="permission.title">
              <span class="headerMode" id="permissionChipLabel">—</span>
              <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
            </button>
          </div>
          <div class="headerUtils">
            <span class="pluginBar" id="pluginHeader"></span>
            <button class="chip jobsChip" id="jobsBtn" type="button" hidden>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3.4 2.4h5.2L6 5.6 3.4 2.4Z" fill="currentColor"/><path d="M3.4 4.4v4a.8.8 0 0 0 .8.8h3.6a.8.8 0 0 0 .8-.8v-4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="jobsCount">0</span>
              <span data-i18n="header.jobs">jobs</span>
            </button>
            <button class="iconBtn" id="clearHistoryBtn" type="button" data-i18n-title="header.clearHistory">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 4h9M5.5 4V2.8h3V4" stroke="currentColor" stroke-width="1.2"/><path d="M4 4l.6 7.2h4.8L10 4" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button class="logBtn" id="logBtn" type="button">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.2a.8.8 0 0 1 .8.8v3.2h2.4a.8.8 0 0 1 .5 1.4l-3.4 3.4a.8.8 0 0 1-1.1 0L1.8 6.6a.8.8 0 0 1 .5-1.4h2.9V2a.8.8 0 0 1 .8-.8Z" fill="currentColor"/></svg>
              <span data-i18n="header.log">Session log</span>
            </button>
          </div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" type="button" data-view="chat" data-i18n="header.chat">Chat</button>
          <button class="tab" type="button" data-view="trajectory" data-i18n="header.trajectory">Trajectory</button>
        </div>
      </header>
      <div class="scrollBody">
        <div class="heroView" id="heroView">
          <canvas class="heroCanvas" id="heroCanvas"></canvas>
          <div class="heroStack" id="heroStack">
            <div class="heroLogo">
              <span class="rhombus-lg"></span>
              <span class="heroWord">PRTS</span>
            </div>
            <div class="heroTagline" id="heroTagline" data-i18n="hero.tagline">欢迎回归，博士</div>
          </div>
        </div>
        <div class="chatScroll" id="chatScroll" hidden>
          <div class="chatColumn" id="flow"></div>
        </div>
        <div class="trajView" id="trajView" hidden></div>
        <div class="composerArea" id="composerArea">
          <div class="statusRow" id="statusRow" hidden>
            <span class="shimmer" id="statusText">DEEP DIVING</span>
          </div>
          <div class="composerExpandRow">
            <button class="expandBtn" id="composerExpand" type="button" data-i18n-title="composer.expand" aria-expanded="false">
              <svg class="expandIcon" width="16" height="22" viewBox="0 0 16 22" fill="none">
                <path d="M8 1 L15 13 L10.6 13 M8 1 L1 13 L5.4 13" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                <circle class="edot" cx="8" cy="16" r="1.15" fill="currentColor"/>
                <circle class="edot" cx="8" cy="19" r="1.15" fill="currentColor"/>
                <circle class="edot" cx="8" cy="22" r="1.15" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="composerCard" id="composerCard">
            <!-- dsh-web style bar above the initial input area: workspace
                 folder (select + add), mode (agent preset), model and
                 reasoning. Visible on the welcome screen. -->
            <div class="heroBar" id="heroBar">
              <button class="chip heroBarWs" id="heroWsBtn" type="button" data-i18n-title="workspace.switch">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M5.3 2H2.2a.9.9 0 0 0-.9.9v6.2a.9.9 0 0 0 .9.9h7.6a.9.9 0 0 0 .9-.9V4.4a.9.9 0 0 0-.9-.9H6L5.3 2Z" fill="currentColor"/></svg>
                <span class="label" id="heroWsLabel">dsh</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
              </button>
              <button class="chip" id="heroModeChip" type="button" data-i18n-title="mode.title">
                <span class="modeChipIcon" id="heroModeChipIcon"></span>
                <span class="label" id="heroModeLabel">STANDARD</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
              </button>
              <button class="chip" id="heroModelChip" type="button" data-i18n-title="model.title">
                <span class="dot"></span>
                <span class="label" id="heroModelLabel">dsh</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
              </button>
              <button class="chip" id="heroReasoningChip" type="button" hidden data-i18n-title="reasoning.title">
                <span class="label" id="heroReasoningLabel">—</span>
                <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
              </button>
            </div>
            <div class="attachStrip" id="attachStrip" hidden></div>
            <textarea class="composerInput" id="composerInput" rows="1" spellcheck="false" data-i18n-placeholder="composer.placeholder"></textarea>
            <div class="composerToolbar">
              <div class="toolGroup">
                <span class="pluginBar" id="pluginComposer"></span>
                <button class="chip" id="modelChip" type="button">
                  <span class="dot"></span>
                  <span class="label" id="modelChipLabel">dsh</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
                <button class="chip reasoningChip" id="reasoningChip" type="button" hidden data-i18n-title="reasoning.title">
                  <span class="label" id="reasoningChipLabel">—</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
                <button class="chip" id="composerPermissionChip" type="button" hidden data-i18n-title="permission.title">
                  <span class="label" id="composerPermissionChipLabel">—</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
                <button class="chip" id="commandsChip" type="button">
                  <span data-i18n="composer.commands">Commands</span>
                  <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.7 4.2a.6.6 0 0 1 .9 0L6 6.7l2.4-2.5a.6.6 0 1 1 .9.9l-2.9 3a.6.6 0 0 1-.9 0l-2.9-3a.6.6 0 0 1 0-.9Z" fill="currentColor"/></svg>
                </button>
              </div>
              <div class="spacer"></div>
              <div class="toolGroup">
                <button class="meterBtn" id="attachBtn" type="button" data-i18n-title="composer.attach">
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.8 9.4V1.8M3.4 5.2 6.8 1.8l3.4 3.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.2 7.6v2.4a1 1 0 0 0 1 1h6.6a1 1 0 0 0 1-1V7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
                </button>
                <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="display:none;">
                <button class="meterBtn voiceBtn" id="voiceBtn" type="button" title="Voice input" data-i18n-title="voice.off">
                  <svg class="micIcon" width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.2a2 2 0 0 0-2 2v3.1a2 2 0 0 0 4 0V3.2a2 2 0 0 0-2-2Z" stroke="currentColor" stroke-width="1.1"/><path d="M2.6 6a3.9 3.9 0 0 0 7.8 0M6.5 9.9v1.9M4.6 11.8h3.8" stroke="currentColor" stroke-width="1.1"/></svg>
                </button>
                <button class="meterBtn" id="meterBtn" type="button">
                  <svg class="ring" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="7" cy="7" r="5.5" stroke="var(--prts-hairline-strong)" stroke-width="1.5" fill="none"/>
                    <circle id="meterRing" cx="7" cy="7" r="5.5" stroke="var(--prts-ink)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="34.56" stroke-dashoffset="34.56" transform="rotate(-90 7 7)"/>
                  </svg>
                  <span id="meterLabel">0%</span>
                </button>
                <button class="sendBtn" id="sendBtn" type="button" title="Send" disabled>
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11.2l-3.6-3.6a.8.8 0 1 1 1.1-1.1l4.8 4.8a.8.8 0 0 1 0 1.1l-4.8 4.8a.8.8 0 1 1-1.1-1.1l3.6-3.6H2a.8.8 0 0 1 0-1.5Z" fill="currentColor"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="dockStats" id="statsDock" hidden></div>
        </div>
      </div>
    </div>
  </main>

  <section class="dtCol" id="dtCol">
    <div class="dtPanel">
      <div class="dtHeader">
        <span class="dtTitle" id="dtTitle" data-i18n="details.title">Details</span>
